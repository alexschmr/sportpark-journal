<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sportpark Journal online | FC Tirschenreuth</title>
<meta name="description" content="Das Sportpark Journal des FC Tirschenreuth online: Berichte, Spielpläne und Geschichten aus dem Sportpark.">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="preload" href="fonts/Anton-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<style id="css">:root{
  --black:#000000;
  --flood:#FDC300;
  --turf:#13251A;
  --chalk:#FFFFFF;
  --mist:#D9D9D4;
  --paper:#FFFFFF;
  --text:#111111;
  --muted:#5E5E59;
  --rule:#D9D9D4;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --serif:"Newsreader","Georgia","Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--black);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#101010;--text:#EEEEEA;--muted:#A3A39D;--rule:#2B2B2B;}
}
:root[data-theme="dark"]{--paper:#101010;--text:#EEEEEA;--muted:#A3A39D;--rule:#2B2B2B;}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--black);color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.55;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--flood);outline-offset:3px}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#fff;color:#000;border-bottom:1px solid #E4E4DF}
.top .wrap{display:flex;align-items:center;gap:22px;min-height:66px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{width:38px;height:38px}
.brand b{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand span{display:flex;flex-direction:column;align-items:flex-start}
.brand i{font-family:var(--serif);color:#000;font-size:17px;line-height:1;margin:3px 0 0}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 11px;text-decoration:none;color:#000;font-size:16px;white-space:nowrap;border-bottom:3px solid transparent}
.nav a:hover{color:#000;border-bottom-color:#000}
.nav a[aria-current="page"]{color:#000;border-bottom-color:var(--flood)}
.desk-btn{flex:none;background:none;border:1px solid var(--flood);color:var(--flood);padding:7px 13px;cursor:pointer;font-size:15px}
.desk-btn:hover{background:var(--flood);color:var(--black)}
/* FC ausgestanzt */
.fc-ko{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fc-ko text{font-family:var(--display);font-size:1em;letter-spacing:inherit}
/* Burger */
.burger{display:none;margin-left:auto;width:46px;height:46px;background:none;border:0;padding:11px 9px;cursor:pointer;flex-direction:column;justify-content:space-between}
.burger span{display:block;height:3px;background:#000;transition:transform .25s,opacity .2s}
.top.open .burger span:nth-child(1){transform:translateY(10.5px) rotate(45deg)}
.top.open .burger span:nth-child(2){opacity:0}
.top.open .burger span:nth-child(3){transform:translateY(-10.5px) rotate(-45deg)}
@media (max-width:760px){
  .top .wrap{position:relative}
  .brand b{font-size:20px}
  .burger{display:flex}
  .nav{display:none;position:absolute;left:-20px;right:-20px;top:100%;flex-direction:column;gap:0;margin:0;padding:6px 20px 18px;background:#fff;border-bottom:3px solid var(--flood);box-shadow:0 12px 24px rgba(0,0,0,.12);overflow:visible;max-height:calc(100svh - 66px);overflow-y:auto}
  .top.open .nav{display:flex}
  .nav a{font-family:var(--display);text-transform:uppercase;font-size:26px;letter-spacing:.01em;padding:12px 0;border-bottom:1px solid #E4E4DF;color:#000}
  .nav a:last-child{border-bottom:0}
  .nav a[aria-current="page"]{color:#000;border-bottom-color:#E4E4DF;text-decoration:underline;text-decoration-color:var(--flood);text-decoration-thickness:4px;text-underline-offset:6px}
}

/* Hero */
.hero{position:relative;min-height:calc(100svh - 66px);overflow:hidden;background:var(--black);color:var(--chalk);display:flex;align-items:flex-end;isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;z-index:-2;transform:scale(calc(1.04 + var(--p,0) * .16)) translateY(calc(var(--p,0) * 6%));transform-origin:50% 40%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,.85) 88%,#000 100%)}
.hero-inner{width:min(1240px,100% - 40px);margin-inline:auto;padding-bottom:clamp(36px,7vh,80px);transform:translateY(calc(var(--p,0) * -18%))}
.mast{display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:clamp(12px,2vw,26px)}
.mast-fc{position:relative;background:none;color:transparent;font-family:var(--display);font-size:clamp(70px,13.5vw,212px);line-height:.78;padding:.1em .08em .02em;align-self:stretch;display:flex;align-items:center}
.mast-words{font-family:var(--display);text-transform:uppercase;font-size:clamp(48px,9.4vw,148px);line-height:.84;letter-spacing:-.005em}
.mast-words span{display:block;overflow:hidden;line-height:1.04;padding-top:.05em;margin-top:-.05em}
.mast-words span>em{display:block;font-style:normal}
.hero-sub{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:18px 40px;margin-top:clamp(18px,3vh,34px)}
.hero-sub p{margin:0;font-style:italic;font-size:clamp(20px,2.3vw,28px);max-width:30ch}
.hero-sub p strong{display:block;font-style:normal;font-weight:600;color:var(--flood);font-size:.8em;margin-top:4px}
.go-lead{display:inline-flex;align-items:center;gap:14px;text-decoration:none;font-family:var(--display);text-transform:uppercase;font-size:22px;letter-spacing:.02em;color:var(--black);background:var(--flood);padding:14px 20px 12px;position:relative;overflow:hidden}
.go-lead::before{content:"";position:absolute;inset:0;background:var(--chalk);transform:translateY(101%);transition:transform .35s cubic-bezier(.2,.7,.2,1);z-index:0}
.go-lead:hover::before{transform:none}
.go-lead span{position:relative;z-index:1}
.go-lead svg{position:relative;z-index:1;width:18px;height:18px;transition:transform .35s}
.go-lead:hover svg{transform:translateY(4px)}

@media (prefers-reduced-motion:no-preference){
  .hero.intro .hero-img{animation:flood 2.2s steps(1,end) both, settle 2.2s ease-out both}
  .hero.intro .mast-fc{animation:rise .9s 1.1s cubic-bezier(.2,.8,.2,1) both}
  .hero.intro .mast-words span>em{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .hero.intro .mast-words span:nth-child(1)>em{animation-delay:1.2s}
  .hero.intro .mast-words span:nth-child(2)>em{animation-delay:1.32s}
  .hero.intro .hero-sub{animation:fadein .8s 1.7s both}
}
@keyframes flood{0%{filter:brightness(.06) saturate(.2)}14%{filter:brightness(.55) saturate(.6)}17%{filter:brightness(.1) saturate(.3)}29%{filter:brightness(.8) saturate(.8)}31%{filter:brightness(.3) saturate(.5)}44%,100%{filter:none}}
@keyframes settle{from{transform:scale(1.14)}to{transform:scale(1.04)}}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* Ticker */
.ticker{background:var(--flood);color:var(--black);overflow:hidden;border:0;margin:0;display:block}
.ticker-track{display:flex;width:max-content;animation:tick 110s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker ul{display:flex;list-style:none;margin:0;padding:12px 0;gap:0}
.ticker a{text-decoration:none;color:inherit}
.ticker a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.ticker li{font-family:var(--display);text-transform:uppercase;font-size:26px;line-height:1.1;white-space:nowrap;display:flex;align-items:center}
.ticker li::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--black);margin:0 28px}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;flex-wrap:wrap;width:auto}.ticker ul:nth-child(2){display:none}.ticker ul{flex-wrap:wrap;padding-inline:20px}}

/* Paper sections */
.paper{background:var(--paper);color:var(--text);display:flow-root}
.sec{padding-block:clamp(56px,9vw,110px)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:clamp(28px,4vw,44px)}
.sec-head h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,6vw,76px);line-height:1.02;margin:0}
.sec-head p{margin:0;color:var(--muted);font-style:italic}
.kicker{font-size:15px;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.kicker b{font-weight:600;color:var(--text)}
.kicker .pipe{width:1px;height:14px;background:currentColor;opacity:.5}

/* Lead */
.lead{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:center}
.lead figure{margin:0}
.lead-img{position:relative;overflow:hidden;background:#000}
.lead-img img{width:100%;aspect-ratio:5/4;object-fit:cover;object-position:50% 0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.lead a:hover .lead-img img{transform:scale(1.035)}
.lead h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(46px,6.6vw,104px);line-height:1.02;margin:0 0 22px}
.lead h3 a{text-decoration:none}
.lead .teaser{font-style:italic;font-size:clamp(19px,1.6vw,22px);line-height:1.5;margin:0 0 26px;max-width:40ch}
.readmore{display:inline-block;font-weight:600;font-size:17px;text-decoration:none;padding-bottom:2px;background:linear-gradient(var(--flood),var(--flood)) 0 100%/100% 4px no-repeat;transition:background-size .3s}
.readmore:hover{background-size:100% 100%;color:var(--black)}
@media (max-width:860px){.lead{grid-template-columns:1fr}}

/* Fixtures board */
.board{background:var(--turf);color:var(--chalk)}
.board .sec-head h2{color:var(--flood)}
.board .sec-head p{color:#B9C4BC}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tab{background:transparent;border:1px solid #5d6f63;color:var(--chalk);padding:8px 16px;cursor:pointer;font-size:16px}
.tab[aria-selected="true"]{background:var(--flood);border-color:var(--flood);color:var(--black);font-weight:600}
.fx-league{font-style:italic;color:#B9C4BC;margin:0 0 8px}
.fx{list-style:none;margin:0;padding:0;border-top:1px solid #3a4c40}
.fx li{display:grid;grid-template-columns:130px 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid #3a4c40}
.fx .d{font-family:var(--display);font-size:clamp(30px,3.4vw,44px);color:var(--flood);line-height:1}
.fx .o{font-size:clamp(20px,2vw,26px);line-height:1.2}
.fx .w{font-size:15px;color:#B9C4BC;text-align:right}
.fx .w.home{color:var(--chalk)}
.fx .w.home::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--flood);margin-right:8px;vertical-align:1px}
@media (max-width:560px){.fx li{grid-template-columns:92px 1fr;row-gap:2px}.fx .w{grid-column:2;text-align:left}}

/* Article grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(28px,3vw,40px) clamp(20px,2.4vw,32px)}
.card{grid-column:span 4;display:flex;flex-direction:column}
.card.big{grid-column:span 6}
.card a.hit{text-decoration:none;display:block}
.card .ph{overflow:hidden;background:#000;margin-bottom:16px}
.card .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 0;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card a.hit:hover .ph img{transform:scale(1.05)}
.card h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(28px,2.6vw,36px);line-height:1.1;margin:0 0 10px}
.card.big h3{font-size:clamp(34px,3.6vw,52px)}
.card a.hit:hover h3{text-decoration:underline;text-decoration-color:var(--flood);text-decoration-thickness:4px;text-underline-offset:4px}
.card .teaser{font-style:italic;color:var(--muted);margin:0;font-size:17px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;font-style:italic;color:var(--muted)}
@media (max-width:980px){.card,.card.big{grid-column:span 6}}
@media (max-width:620px){.card,.card.big{grid-column:1/-1}}

/* Band */
.band{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--black);color:var(--chalk)}
.heft{background:var(--flood);display:flex;align-items:center;justify-content:center;padding:clamp(40px,6vw,80px) 24px;min-height:420px;overflow:hidden}
.heft-stack{position:relative;width:min(340px,70%);transform:rotate(-5deg)}
.heft-stack::before,.heft-stack::after{content:"";position:absolute;inset:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.heft-stack::before{transform:translate(14px,10px) rotate(3deg)}
.heft-stack::after{transform:translate(7px,5px) rotate(1.5deg)}
.heft-stack img{position:relative;z-index:1;width:100%;height:auto;box-shadow:0 28px 50px -12px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.3);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.band:hover .heft-stack img{transform:translateY(-8px) rotate(1deg)}
.band-text{padding:clamp(40px,6vw,90px) clamp(20px,5vw,80px);align-self:center}
.band-text h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,5vw,72px);line-height:1.02;margin:0 0 20px;color:var(--flood)}
.band-text p{max-width:46ch;margin:0 0 16px;font-size:19px}
.insta{display:inline-flex;gap:10px;align-items:center;margin-top:10px;color:var(--black);background:var(--chalk);text-decoration:none;padding:11px 18px;font-weight:600;border-radius:999px;transition:background .25s}
.insta:hover{background:var(--flood)}
@media (max-width:820px){.band{grid-template-columns:1fr}.heft{min-height:0}}

/* Footer */
.foot{background:var(--black);color:#BDBDB8;font-size:15px;padding-block:56px 40px;border-top:1px solid #222}
.foot .wrap{display:grid;grid-template-columns:auto 1fr 1fr;gap:28px 48px;align-items:start}
.foot img{width:72px;height:72px}
.foot h4{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--chalk);font-size:22px;margin:0 0 8px}
.foot p{margin:0 0 6px}
@media (max-width:760px){.foot .wrap{grid-template-columns:1fr}}

/* Article page */
.art-hero{margin:0;background:#000}
.art-hero img{width:100%;max-height:78vh;object-fit:cover;object-position:50% 0}
.cap{background:var(--black);color:var(--chalk);font-style:italic;font-weight:600;font-size:15px;line-height:1.4;padding:10px 14px;margin:0}
.art{width:min(780px,100% - 40px);margin-inline:auto;padding-block:clamp(40px,6vw,72px)}
.art h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,7.4vw,96px);line-height:1.02;margin:6px 0 22px;hyphens:auto;-webkit-hyphens:auto}
.art .teaser{font-style:italic;font-size:clamp(21px,2.2vw,26px);line-height:1.45;margin:0 0 18px}
.art .meta{color:var(--muted);font-size:15px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin-bottom:34px}
.body p{font-size:20px;line-height:1.7;margin:0 0 1.05em;hyphens:auto}
.body h3{font-family:var(--serif);font-weight:700;font-size:23px;margin:1.7em 0 .5em}
.gallery{width:min(1100px,100% - 40px);margin:0 auto;padding-bottom:clamp(48px,6vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,420px));justify-content:center;align-items:start;gap:22px}
.gallery figure{margin:0;background:#000}
.gallery img{width:100%;height:auto}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:16px;margin-bottom:22px;color:var(--muted)}
.back:hover{color:var(--text)}
.more{}

/* Editor */
.desk{background:var(--paper);color:var(--text);min-height:80vh}
.desk .wrap{padding-block:40px 80px}
.desk h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,6vw,72px);margin:0 0 6px;line-height:1.02}
.desk-bar{position:sticky;top:calc(66px + env(safe-area-inset-top,0px));z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);padding:14px 0;margin-bottom:26px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.status{font-size:15px;color:var(--muted)}
.status.dirty{color:var(--text);font-weight:600}
.meter{font-size:14px;color:var(--muted)}
.meter.warn{color:#B3261E;font-weight:600}
.publish{margin-left:auto;background:var(--flood);color:var(--black);border:2px solid var(--black);font-family:var(--display);text-transform:uppercase;font-size:20px;padding:10px 18px 8px;cursor:pointer}
.publish:disabled{opacity:.45;cursor:not-allowed}
.dtabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.dtabs button{background:none;border:1px solid var(--rule);color:var(--text);padding:8px 14px;cursor:pointer}
.dtabs button[aria-selected="true"]{background:var(--text);color:var(--paper);border-color:var(--text)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.rows li{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.rows img{width:72px;height:54px;object-fit:cover;background:#000}
.rows strong{display:block;line-height:1.25}
.rows small{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sbtn{background:none;border:1px solid var(--rule);color:var(--text);padding:6px 11px;cursor:pointer;font-size:15px}
.sbtn:hover{border-color:var(--text)}
.sbtn.danger:hover{border-color:#B3261E;color:#B3261E}
.newbtn{background:var(--text);color:var(--paper);border:none;padding:10px 16px;cursor:pointer;margin-top:18px}
.form{display:grid;gap:18px;max-width:820px}
.form label{display:grid;gap:6px;font-weight:600;font-size:15px}
.form .hint{font-weight:400;color:var(--muted);font-size:14px}
.form input[type=text],.form input[type=date],.form select,.form textarea{border:1px solid var(--rule);background:var(--paper);color:var(--text);padding:10px 12px;font-weight:400;font-size:17px;border-radius:0}
.form textarea{min-height:120px;line-height:1.55;resize:vertical}
.form textarea.long{min-height:380px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.two{grid-template-columns:1fr}.rows li{grid-template-columns:56px 1fr}.acts{grid-column:1/-1;justify-content:flex-start}}
.check{display:flex !important;grid-template-columns:none;align-items:center;gap:10px;font-weight:600}
.imgpick{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start;border:1px dashed var(--rule);padding:14px}
.imgpick img{width:160px;height:120px;object-fit:cover;background:#000}
.imgpick .noimg{width:160px;height:120px;background:repeating-linear-gradient(45deg,var(--rule) 0 6px,transparent 6px 12px)}
.gal-edit{display:grid;gap:12px}
.form fieldset{border:1px solid var(--rule);padding:16px;display:grid;gap:14px;margin:0}
.form legend{font-family:var(--display);text-transform:uppercase;font-size:20px;padding:0 6px}
.note{background:var(--flood);color:var(--black);padding:14px 16px;max-width:820px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--chalk);border:2px solid var(--flood);padding:12px 18px;z-index:99;max-width:min(560px,92vw);font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Inline images in articles */
.body::after{content:"";display:block;clear:both}
.body .inl{margin:1.6em 0;background:#000}
.body .inl img{width:100%;max-height:78vh;object-fit:cover;object-position:50% 0}
@media (min-width:900px){
  .body .inl{width:52%;margin-top:.35em;margin-bottom:1.3em}
  .body .inl.right{float:right;margin-left:30px;margin-right:-60px}
  .body .inl.left{float:left;margin-right:30px;margin-left:-60px}
