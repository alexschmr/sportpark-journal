<script id="state" type="application/json">{"season":"2026/27","currentIssue":"2026-03","issues":[{"id":"2026-03","label":"Ausgabe 3, Oktober 2026","type":"Ausgabe","date":"2026-10-04"},{"id":"md-thiersheim","label":"Matchday Spezial zum Heimspiel gegen TSV Thiersheim","type":"Matchday","date":"2026-09-20"},{"id":"2026-02","label":"Ausgabe 2, September 2026","type":"Ausgabe","date":"2026-09-06"},{"id":"2026-01","label":"Ausgabe 1, Juli/August 2026","type":"Ausgabe","date":"2026-07-26"}],"claim":"Immer up to date mit dem FCT.","heroImg":"hero_player","bandImg":"heft_sep","chairImg":"wonke","crest":"img/crest.png","fixtures":[{"team":"Erste","league":"Kreisliga","bfv":"","games":[{"date":"04.10.","opp":"FC Marktleuthen","ha":"H","time":"16:00"},{"date":"10.10.","opp":"SV Mitterteich 2","ha":"A","time":"15:00"},{"date":"18.10.","opp":"TSV Waldershof","ha":"H","time":"16:00"},{"date":"24.10.","opp":"VfB Arzberg","ha":"A","time":"14:00"},{"date":"31.10.","opp":"VfB Rehau","ha":"H","time":"15:00"}]},{"team":"Reserve","league":"Kreisklasse","bfv":"","games":[{"date":"04.10.","opp":"SG Friedenfels/Fuchsmühl","ha":"H","time":"14:00"},{"date":"11.10.","opp":"SG Griesbach/Großkonreuth/Mähring","ha":"A","time":"14:00"},{"date":"18.10.","opp":"TSV Waldershof 2","ha":"H","time":"14:00"},{"date":"24.10.","opp":"SV Poppenreuth","ha":"A","time":"13:00"},{"date":"31.10.","opp":"SG Neualbenreuth/Waldsassen","ha":"H","time":"13:00"}]},{"team":"Damen","league":"Hobbyliga","bfv":"","games":[{"date":"10.10.","opp":"TSV Arzberg-Röthenbach","ha":"A"}]},{"team":"U19","league":"Bezirksoberliga, Heimspiele beim ATSV Tirschenreuth","bfv":"","games":[{"date":"03.10.","opp":"JFG GW Frankenwald","ha":"H"},{"date":"11.10.","opp":"JFG Kunstadt-Obermain","ha":"A"},{"date":"17.10.","opp":"FC Eintracht Bamberg 2","ha":"H"},{"date":"25.10.","opp":"JFG Bayreuth West","ha":"A"},{"date":"31.10.","opp":"SG Mainauen/Metzdorf","ha":"A"}]}],"articles":[{"id":"erste-erfolgsstory","rubrik":"Erste","liga":"Kreisliga","issue":"2026-03","lead":true,"date":"2026-09-29","author":"Alexander Schirmer","title":"Erfolgsstory fortsetzen!","teaser":"Der September war ein wahrlich goldener Monat für die Waller-Elf, dessen Glanz nur auf den letzten Metern eine minimale Patina abbekommen hat. Jetzt warten große Herausforderungen, auf der Gegner-Seite und im eigenen Kader.","img":"cover","caption":"","body":"Phänomenale Auftritte und die Fortführung der ungeschlagenen Serie haben die Truppe auf den wohlbekannten Relegationsplatz zwei geführt, den es jetzt zumindest mal zu verteidigen gilt.\n\n16:1 Tore, drei Siege, ein Unentschieden: So liest sich die September-Bilanz der ersten Mannschaft. Diese starke Form hat dazu beigetragen, dass man auch in dieser Spielzeit wieder ein doch schon aussagekräftiges Wörtchen mitreden darf, wenn es um die Verteilung der Spitzenplätze in der Kreisliga geht.\n\nDie Mannschaft um Kapitän Bastian Popp hat während dieser Phase gezeigt, dass sie gegen die unterschiedlichsten Gegner bestehen kann und die nötige Konzentration mitbringt, um sich auch mental voll im Griff zu haben. So wurde beim 8:0 gegen den Aufsteiger TSV Arzberg-Röthenbach die Überforderung des Gegners gnadenlos ausgenutzt, und man hat die Fehler eiskalt bestraft. Beim 2:0-Sieg auf der Thanhausener Spielwiese bewies die Mannschaft Resilienz dem Gegner und dem Untergrund gegenüber. Und beim beeindruckenden 5:0 gegen den bis dato Zweiten aus Thiersheim spielte die Truppe wie aus einem Guss, auch ohne Torjäger und Fixstern im Angriffssystem Nico Stark.\n\n## Stolperstein Wiesau\nGegen die SpVgg Wiesau hingegen gab es einen kleinen Schluckauf im Vergleich zu den Fußball-Festspielen zuvor. Der Gegner hatte sich hervorragend auf die Waller-Elf eingestellt, stand tief, spielte konsequent destruktiv und lauerte auf Nadelstiche. Einer davon piekste auch unangenehm ins FC-Fleisch und sorgte für das einzige Gegentor, das zugleich den ersten Punktverlust im September bedeutete. Doch dieses 1:1 soll lediglich ein kurzes Straucheln sein, das man direkt ausbügeln möchte.\n\n## Enges Verfolgerfeld\nUnd übrigens auch muss. Denn die halbe Liga knubbelt sich hinter dem Klassenprimus aus Arzberg immer noch heftiger und enger zusammen als hysterische Mädels beim ZARA-Sale. Um in diesem Knäuel weiterhin vorne mitzumischen, braucht es regelmäßig Punkte aufs eigene Konto.\n\nDabei stehen zunächst zwei Mannschaften im Weg, mit denen man sich in den vergangenen Jahren immer wieder schwergetan hat. Erst der FC Marktleuthen, der sich über die jüngere Vergangenheit immer mehr ehemalige Top-Spieler aus höheren Ligen zusammengesammelt hat, die komischerweise gegen den FC Tirschenreuth immer alle Zeit haben und zu Topform auflaufen. Danach kommt es zum brisanten Duell mit der Reserve des SV Mitterteich, die in diesem Jahr wiedererstarkt und gefährlich daherkommt.\n\n## Topduelle im Wochentakt\nAnschließend geht es Schlag auf Schlag in die Rückrunde: Waldershof, Arzberg, Rehau. Puh, was ein Programm.\n\nFür die beiden letzten Hinrundenspiele kommt erschwerend hinzu, dass man beim FC auf Patrick Rahn verzichten muss. Der Keeper sah in Wiesau in der letzten Aktion die Rote Karte und wird vermutlich mindestens zwei Spiele fehlen. Für den jungen Torwart sind es die ersten Minuten im Herrenbereich, die er von außen verfolgen muss.\n\n## Ersatz im Kasten\nAuch diesen Ausfall wird der Kader auffangen müssen. Mit Max Schramm steht ein Ersatzmann bereit, der in den vergangenen Wochen bei der Reserve starke Leistungen gezeigt hat.","gallery":[{"img":"erste","caption":"In Abwesenheit von Nico Stark glänzten andere Offensiv-Spieler wie Andreas Bäuml oder auch Michael Gmeiner."},{"img":"rahn","caption":"Nach seinem Platzverweis kurz vor Schluss in Wiesau wird Keeper Patrick Rahn der Mannschaft zunächst fehlen. Eine empfindliche Schwächung."}]},{"id":"reserve-dranbleiben","rubrik":"Reserve","liga":"Kreisklasse","issue":"2026-03","lead":false,"date":"2026-09-29","author":"","title":"Dranbleiben","teaser":"Die Reserve ist auch nach einem durchwachsenen September noch in der Kreisklassen-Spitzengruppe.","img":"reserve","caption":"","body":"Zuschauen statt Punkten hieß es für die Reserve zum Abschluss des Septembers. Die angesetzte Partie gegen Tröstau fiel aufgrund des Totalkollapses des Gegners (Rückzug der Mannschaft) ins Wasser. Damit steht auf dem Papier eine durchwachsene Monatsbilanz. Sieg, Niederlage, Unentschieden. Trotzdem überwiegt der Optimismus, was den weiteren Saisonverlauf angeht.\n\n„Es war eine extrem unnötige Niederlage“, schaut Reservetrainer Gerhard Rasp auf das 0:1 gegen die Sportfreunde Kondrau zurück. Ein recht wackeliger Elfmeterpfiff hatte seine Truppe damals auf die Verliererstraße gebracht. Die Reaktion im Spitzenspiel gegen den SV Pechbrunn eine Woche später war aber wieder erfreulich. Beim 0:0 gegen den Spitzenreiter war man über weite Strecken die bessere Mannschaft und hielt mehr als gut mit.\n\nJetzt geht es gegen das nächste Kreisklassen-Schwergewicht, die SG Friedenfels/Fuchsmühl. Danach steht zum Abschluss der Hinrunde noch das Auswärtsspiel gegen Kellerkind SG Griesbach/Großkonreuth/Mähring auf dem Programm. Sind diese kontrastreichen Aufgaben bewältigt, kann auch die Reserve in die Rückrunde starten. Hier gilt es, die Entwicklung zu bestätigen.\n\nDenn auch die zweite Mannschaft zeigt, wie die Trainingsarbeit des Gespanns Waller/Rasp Früchte trägt und der Weg hin zu einem deutlich spielwitzigeren Fußball eingeschlagen wurde. Auch bei der Pleite gegen Kondrau zum Beispiel versuchten sich die Jungs immer wieder über die Flügel durchzukombinieren, statt ihr Heil in langen Bällen zu suchen. Natürlich funktioniert das nicht immer, und hier und da ist ein guter alter langer Schlag nach wie vor ein probates Mittel, aber die Richtung stimmt.\n\nGerade die jungen Spieler blühen dabei immer mehr auf. Ein gutes Beispiel ist David Mark, der quasi sein komplettes letztes A-Jugend-Jahr wegen einer langwierigen Verletzung verpasst hatte und dementsprechend zunächst auf sehr leisen Sohlen in den Herrenbereich geschlichen war. In der Eingewöhnungsphase kam er merklich noch nicht vollends mit der Robustheit der Gegner zurecht. Die waren plötzlich keine 17-Jährigen aus der gleichen Gewichtsklasse mehr, sondern zweifache Familienväter mit Vollbart in der Midlife-Crisis. Inzwischen wird er immer spritziger und spielfreudiger. Sein linker Fuß kann der Mannschaft gerade bei Standards gewaltig helfen.\n\nAußerdem zaubert der Trainer immer wieder Routiniers wie Ramon Illner oder David Malzer aus dem Hut, die der Mischung je nach Gegner und Anforderung an die Partie die Extraportion Würze verleihen.","gallery":[{"img":"mark","caption":"David Mark ist einer der jungen Spieler, die das Spiel der Reserve immer mehr bereichern und mit ihrem Einsatz zum aktuellen Aufwärtstrend beitragen."}]},{"id":"damen-2026","rubrik":"Damen","liga":"Hobbyliga","issue":"2026-03","lead":false,"date":"2026-09-29","author":"","title":"Unsere Damenmannschaft 2026/2027","teaser":"Sechs neue Spielerinnen, zwei Siege aus drei Spielen und aktuell Platz zwei in der Hobbyliga. Ein Start, der sich sehen lassen kann.","img":"damen","caption":"","body":"Auch in dieser Saison schickt der FC wieder eine Damenmannschaft auf die Plätze der regionalen Hobbyliga. Dafür verantwortlich ist Trainer-Urgestein Max Burger. Er hat inzwischen den vierten oder fünften Generationswechsel gemeistert. So genau weiß das keiner mehr. Und wieder hat er eine motivierte und ambitionierte Truppe beisammen.\n\nDeshalb weht auch ein gehörig frischer Wind durch die Kabine der FC-Damen. Gleich sechs neue Spielerinnen hat die Mannschaft zur Saison 2026 dazugewonnen.\n\nUnd die Neuen haben sich schnell eingefunden. Nach drei Spielen stehen zwei Siege und eine Niederlage zu Buche. Das bedeutet aktuell Platz zwei in der Hobbyliga. Ein Start, der sich sehen lassen kann.\n\n## Mutprobe auf Großfeld\nDas Highlight der Vorbereitung lieferte Ende August ein Test der besonderen Art. Gegner war der Kreisligist ATG Tröstau. Gespielt wurde auf Großfeld und über volle 90 Minuten. Für eine Hobbyliga-Truppe ist das ungewohntes Terrain. Beeindrucken ließen sich unsere Damen davon aber nicht. Mitte der ersten Halbzeit ging der FC sogar mit 1:0 in Führung. Zur Pause stand es 1:3. Noch in Schlagdistanz.\n\nAm Ende stand ein 1:7 auf dem Zettel. Das Ergebnis fällt definitiv zu hoch aus. Über weite Strecken war man dem Kreisligisten ebenbürtig. Erst mit zunehmender Spieldauer machte sich die ungewohnte Distanz bemerkbar. Die Beine wurden schwerer, die Wege länger. Und Tröstau wusste das zu nutzen, was am Ende die Höhe der Niederlage erklärte.\n\nTrotzdem war es ein guter und wertvoller Test. Einer, der nach einer Neuauflage schreit. Im kommenden Jahr soll es das Wiedersehen geben, dann gerne auf heimischem Rasen.\n\n## Nächster Halt: Arzberg\nWeiter geht es am Samstag, 10. Oktober, auswärts beim TSV Arzberg-Röthenbach. Dort gilt es, den Platz an der Sonne zu verteidigen und die nächsten Punkte einzusammeln.\n\n## Im Vereinsleben voll drin\nNeben dem sportlichen Geschehen ist die Damenmannschaft längst ein fester Bestandteil des Vereinslebens. Bei Festen und Events packen die Spielerinnen tatkräftig mit an. Außerdem engagieren sich immer wieder einige von ihnen als Trainerinnen in der Nachwuchsabteilung. Zuletzt standen bei einem Trainingsspiel mehr als 20 Mädels auf dem Platz.\n\nIm Anschluss ließ die ganze Truppe den Tag beim gemeinsamen Grillen ausklingen und verfolgte die Spiele der Herrenteams. So geht gegenseitige Unterstützung!","gallery":[{"img":"grill","caption":"Nach dem Trainingsspiel ging es gemeinsam an den Grill."}]},{"id":"f-jugend-imerys","rubrik":"Jugend","liga":"F-Jugend","issue":"2026-03","lead":false,"date":"2026-09-29","author":"","title":"Schwarz-Gold steht auch dem Nachwuchs","teaser":"Unsere F-Jugend läuft in neuen Trikots auf. Möglich gemacht hat das Imerys Tableware aus Tirschenreuth.","img":"fjugend","caption":"","body":"Neulich war es so weit. Unsere F-Jugend lief zum ersten Mal in ihren neuen Trikots auf. Schwarz-Gold, frisch aus dem Karton und direkt im Turniereinsatz. Wer die Jungs und Mädels dabei beobachtet hat, sah vor allem eines: stolzgeschwellte Brust. Und die neuen Hemden können sich wirklich sehen lassen.\n\n## Danke, Imerys!\nMöglich gemacht hat das Imerys Tableware aus Tirschenreuth. Dafür sagen wir im Namen der Mannschaft, des Trainerteams und des ganzen Vereins: Vergelt’s Gott! Es ist nicht selbstverständlich, dass ein Unternehmen aus der Region in die Jugendarbeit vor Ort investiert. Genau solche Partner braucht ein Verein. Nur so können wir unseren Kindern weiter gute Bedingungen bieten. Und vor allem jede Menge Spaß am Fußball.\n\n## Wie die Großen\nBesonders schön: Es sind dieselben Trikots, in denen auch unsere Herrenteams auflaufen. Das schafft Identifikation. Wer schon in der F-Jugend die gleichen Farben trägt wie die Erste, der weiß, wo er hingehört. Denn natürlich sind die Spieler der ersten Mannschaft Vorbilder für unsere Nachwuchskicker. Gleich neben den Stars des FC Bayern und des 1. FC Nürnberg, versteht sich. Mit einem entscheidenden Vorteil: Die eigenen Helden kann man im Sportpark aus nächster Nähe erleben.\n\nWir wünschen unserer F-Jugend viel Erfolg in der neuen Spielzeit. Schick genug dafür sind sie ja schon.","gallery":[{"img":"pokal","caption":"Beim Turnier in Pressath war unsere F-Jugend direkt mit den neuen Trikots am Start."},{"img":"sieben","caption":"Hoffentlich gibt es weiterhin viel Grund zum Jubeln in Schwarz-Gold!"},{"img":"fteam","caption":""}]},{"id":"u19-bol","rubrik":"Jugend","liga":"U19, Bezirksoberliga","issue":"2026-03","lead":false,"date":"2026-09-29","author":"","title":"U19 startet erfolgreich in die BOL-Saison","teaser":"Drei Siege zum Auftakt, dann der erste Dämpfer in Coburg. Das Abenteuer Bezirksoberliga hat für unsere SG-A-Jugend überaus erfolgreich begonnen.","img":"u19","caption":"","body":"Das Abenteuer Bezirksoberliga hat für unsere SG-A-Jugend überaus erfolgreich begonnen. Die Mannschaft von Cheftrainer Manuel Waller hat die ersten drei Spiele ihrer Saison mehr als überzeugend gewinnen können.\n\nDie Mannschaft, die ihre Heimspiele in diesem Kalenderjahr bei unserem SG-Partner, dem ATSV Tirschenreuth, austrägt, legte los wie die Feuerwehr. Zum Auftakt schlug sie die SG Kirchenlaibach mit 5:1. Es folgten ein Schützenfest gegen die JFG Leitenbachtal und ein Heimsieg gegen Rödental Coburger Land.\n\nZuletzt gab es den ersten Dämpfer in der anspruchsvollen Spielklasse gegen den FC Coburg. Die 1:6-Niederlage kam am Ende durch wenige Schlüsselszenen zustande. „Es hängt an zwei Aktionen“, beschreibt Trainer Waller die ärgerliche Sequenz mitsamt strittiger Schiedsrichter-Entscheidung.\n\nAber der Blick geht nach vorne. Die nächsten Aufgaben warten bereits. Es ist erfreulich zu sehen, wie die Nachwuchsspieler in der Bezirksoberliga wertvolle Erfahrungen sammeln können, die sie bestmöglich auf den Übergang zum Herrenbereich vorbereiten.\n\nWer die Mannschaft unterstützen möchte, ist zu jedem Heimspiel herzlich willkommen oder kann natürlich auch eine Auswärtsfahrt mit den Jungs unternehmen.","gallery":[]},{"id":"vorsitzender-oktober","rubrik":"Verein","liga":"Bericht vom Vorsitzenden","issue":"2026-03","lead":false,"date":"2026-09-29","author":"Stefan Wonke, 1. Vorsitzender","title":"Positive Trends fortsetzen","teaser":"Erste und Reserve haben sich in den Spitzengruppen ihrer Ligen etabliert, Damen und Jugendteams sind im Aufwind. Ein Blick auf den Oktober.","img":"wonke","caption":"Stefan Wonke, 1. Vorsitzender","body":"Liebe FC-Familie,\n\nuns steht ein spannender Oktober bevor. Sportlich gibt es derzeit natürlich vor allem bei unseren Herrenteams einiges zu bejubeln.\n\n## Fast perfekte Bilanz\nDie erste Mannschaft hat es erfreulich schnell geschafft, sich unter Trainer Manuel Waller zu stabilisieren, und ist auch in dieser Spielzeit wieder ein Spitzenteam in der Kreisliga. Der September war für die Jungs ein „fast“ perfekter Monat mit tollen Siegen, beispielsweise gegen den TSV Thiersheim, und dem Schützenfest gegen Arzberg-Röthenbach (8:0). Einzig in Wiesau setzte es beim 1:1 einen kleinen Dämpfer. Aber das ist Jammern auf hohem Niveau.\n\n## Reserve macht Spaß\nDie Reserve mischt ebenfalls im oberen Drittel der Kreisklasse mit und ist für die zahlreichen jungen Spieler ein perfekter Ort, um die fußballerische Entwicklung voranzutreiben. Dazu kommen die positiven Meldungen aus allen Altersklassen im Jugendbereich. Die Kleinfeldteams um die engagierten Trainer konnten in der Saisonvorbereitung einige Turniersiege einheimsen, und auch die SG-Mannschaften sind erfolgreich in ihre jeweiligen Klassen gestartet. Die A-Junioren haben sogar ihre ersten drei BOL-Spiele gewonnen und waren zwischenzeitlich Tabellenführer in einer Liga, in der sie auf weiter Flur der einzige Vertreter unserer Region sind.\n\n## Mädchentraining gestartet\nWas mich ebenfalls freut: Seit einigen Wochen haben wir ein eigenes Nachwuchs-Training für Mädchen im Programm. Auch hier zeigt sich, dass das Interesse am FC und am Fußball nach wie vor vorhanden ist.\n\nJetzt gilt es für alle Teams, den Fokus nochmals voll auf die sportlichen Aufgaben zu legen, bevor wir in den Jahresendspurt mit Weihnachtsmarkt, Betthupferlgeschichten und Ähnlichem gehen.\n\nSportliche Grüße\nStefan Wonke, 1. Vorsitzender","gallery":[]},{"id":"wedding-season","rubrik":"Verein","liga":"Wedding Season","issue":"2026-03","lead":false,"date":"2026-09-29","author":"","title":"Wenn geheiratet wird, sind wir dabei!","teaser":"Auch in diesem Sommer durften wir wieder einigen unserer FC’ler als Gratulanten bei ihren Hochzeiten unsere Glückwünsche überbringen.","img":"hz1","caption":"Thomas & Sina","body":"Auch in diesem Sommer durften wir wieder einigen unserer FC’ler als Gratulanten bei ihren Hochzeiten unsere Glückwünsche überbringen. Für uns ist es eine Selbstverständlichkeit, bei solchen Events eine starke Abordnung auf die Beine zu stellen!\n\nWenn gefeiert wird, sind wir da!","gallery":[{"img":"hz2","caption":"Flo & Simone"},{"img":"hz3","caption":"David & Tina"}]},{"id":"spiel-fussball-beim-fc","rubrik":"Jugend","liga":"Nachwuchsförderung","issue":"2026-03","lead":false,"date":"2026-09-29","author":"","title":"Spiel Fußball beim FC!","teaser":"Dein Kind liebt es, zu rennen, zu toben und gegen den Ball zu treten? Dann ist jetzt der perfekte Zeitpunkt für die ersten Schritte im Fußball.","img":"flyer_kids","caption":"","body":"Beim FC Tirschenreuth lernen Mädchen und Jungs spielerisch den Umgang mit dem Ball, entdecken ihre Freude an Bewegung und erleben gemeinsam mit anderen Kindern, was Fußball bedeutet. Kicken statt Stillsitzen, Bewegung, Koordination und Geschicklichkeit, gemeinsam spielen und Freunde finden. Und Spaß am Fußball ganz ohne Leistungsdruck.\n\n## G-Jugend, Jahrgänge 2020 und jünger\nMontag, 17 bis 18 Uhr im Sportpark.\nTrainer: Kevin Schmeller, Tobias Schwägerl, Andreas Häring, David Malzer\nKontakt: Tobias Schwägerl, 0160 94828462\n\n## F-Jugend, Jahrgänge 2018 und 2019\nMontag und Mittwoch, 17 bis 18:30 Uhr im Sportpark.\nTrainer: Alex Knoll, Thomas Geisler\nKontakt: Alex Knoll, 0176 31080447\n\n## E-Jugend, Jahrgänge 2016 und 2017\nDienstag und Donnerstag, 17:15 bis 18:45 Uhr im Sportpark.\nTrainer: Florian Ziegler, Johannes Wettinger, Jakob Völkl, Rainer Spitzl, Marco Schwägerl\nKontakt: Marco Schwägerl, 0160 94829230\n\n## Kommt einfach vorbei\nDie Zeiten gelten für die Freiluftsaison. Hallenzeiten können nachgefragt werden. Fragen beantwortet Jugendleiter Marco Schwägerl unter 0160 94829230. Wir freuen uns auf euch!","gallery":[{"img":"flyer_strip","caption":"Kicken statt Stillsitzen: unsere Kleinsten beim Training und bei Turnieren."}]},{"id":"md-wer-bleibt-oben-dran","issue":"md-thiersheim","rubrik":"Erste","liga":"Kreisliga, 10. Spieltag","date":"2026-09-20","title":"Wer bleibt oben dran?","teaser":"Spitzenspielzeit im Sportpark. Es ist eigentlich alles angerichtet für ein echtes Fußballfest in der Kreisliga am 10. Spieltag. Anpfiff: 16:00 Uhr.","img":"thi_baeuml","caption":"Andreas Bäuml zeigte sich zuletzt in bestechender Form und traf regelmäßig. Nach einer schwierigen letzten Saison ist er endlich wieder fit und voll da.","body":"Der FC zeigte sich in den vergangenen Wochen in einer bestechenden Form und hat sich dank einer beeindruckenden Serie auf Platz drei hochgearbeitet. Jetzt kommt eine Mannschaft, die in der Tabelle direkt vor den Hausherren steht und lange Zeit die Liga dominierte: der TSV Thiersheim.\n\nDas Team von Trainer Zettl marschierte bis vor kurzem vorneweg, musste dann aber eine empfindliche 0:4-Pleite bei der Reserve des SV Mitterteich einstecken und wurde so vom Gipfelstürmer zum Verfolger. Also genau die gleiche Ausgangslage wie der FC Tirschenreuth, beide Teams müssen gewinnen, wenn man den Arzbergern auf den Fersen bleiben möchte. Denn der Tabellenführer erledigt Woche für Woche seine Aufgaben mit beinahe mechanisch anmutender, nüchterner Präzision.\n\nDie heutige Partie kann daher richtungsweisend werden. Bei einem Heimsieg springt die Waller-Elf vorbei an den Gästen und macht es sich fürs Erste auf Platz zwei gemütlich. Verliert man, kann es sogar einen Platz weiter nach hinten gehen, denn die Verfolger aus Mitterteich sitzen wiederum dem FCT im Genick und spielen gegen den Aufsteiger aus Wiesau. Spannung garantiert also während der 90 Minuten im Sportpark.\n\n## Drei Spiele ohne Gegentor\nTrainer Manuel Waller peilt mit seiner Truppe natürlich die maximale Ausbeute an. „Wir sind gut in Form und wollen natürlich unsere Serie fortsetzen“, so die Marschroute. Denn seit dem zweiten Spieltag haben die Schwarz-Gelben nicht mehr verloren. Zuletzt blieb man sogar dreimal ohne Gegentreffer. Ein Beleg dafür, wie sich die Mannschaft defensiv gefunden und stabilisiert hat. Großen Anteil daran hat Keeper Patrick Rahn, der in seinen jungen Jahren eine erstaunliche Sicherheit und Präsenz ausstrahlt. Zudem greifen die Automatismen immer besser und die Spieleröffnung funktioniert von Partie zu Partie reibungsloser.\n\n„Die Mannschaft setzt um, was wir vor den Spielen besprechen“, attestiert der Coach und freut sich, dass alle Spieler ihren Teil zum derzeitigen Erfolg beitragen.\n\n## Nico Stark fehlt\nKaderbreite ist auch das Zauberwort für die heutige Partie. Denn die Mannschaft um Kapitän Popp muss einige Umstellungen und Ausfälle kompensieren. Lukas Zeitler, der letzte Woche gegen Bärnau bis zu seiner verletzungsbedingten Auswechslung eine hervorragende Partie spielte, wird vermutlich länger ausfallen.\n\nSiegert und Stark fehlen aus beruflichen Gründen. Besonders die Personalie Nico Stark schmerzt natürlich. Manuel Waller ist sich aber sicher: „Wir werden diese Lücke mit der Qualität, die wir im Kader haben, ausfüllen und die Ausfälle kompensieren!“ Passend dazu kamen in den vergangenen Wochen Andreas Bäuml und Michael Gmeiner in Fahrt und trafen ihrerseits in den vergangenen beiden Partien.\n\n## Kader\nRahn, Popp (C), Ackermann, Gradl, Kollarik, Zant, De Souza, Bäuml A., Zintl J., Gmeiner, Völkl, Scharnagl, Höfler, Waller S., Mayer, Männer, Schramm (ETW)","lead":false,"author":"","gallery":[]},{"id":"md-reserve-gegen-den-spitzenreiter","issue":"md-thiersheim","rubrik":"Reserve","liga":"Kreisklasse","date":"2026-09-20","title":"Reserve gegen den Spitzenreiter","teaser":"Nach dem unnötigen 0:1 in Kondrau kommt Tabellenführer Pechbrunn in den Sportpark. Anpfiff: 14:00 Uhr.","img":"thi_reserve","body":"Eine Niederlage aus der Kategorie „unnötig“ warf die Reserve zuletzt um einen Schritt zurück. Beim 0:1 in Kondrau durften sich die Sportfreunde nach der Partie verwundert die Augen gerieben haben ob des mehr als schmeichelhaften Spielausgangs. Doch Fußball ist eben nicht nur wunderschön, sondern vor allem anderen ein Ergebnissport, und Zahlen sind am Ende kein Stückchen emotional, sondern brutal objektiv. Und so stand eben eine Pleite beim Flutlichtspiel zu Buche.\n\nTabellarisch hatte es fast keine Auswirkung für die Rasp-Schützlinge. Abzüglich der gestrigen Partien steht man immer noch in der Verfolgergruppe der beiden scheinbar enteilten Spitzenteams aus Friedenfels/Fuchsmühl und Pechbrunn.\n\nUnd genau dieser Gegner kommt heute in den Sportpark. Als Tabellenführer wird der Gast mit einer breiten Brust und einem enormen Selbstvertrauen ausgestattet sein. Dennoch will FC-Trainer Rasp nichts von einer Underdog-Rolle wissen. „Der Gegner hat natürlich eine enorme Qualität, aber wir können dagegenhalten!“\n\nDer Schlüssel wird in der Bereitschaft seiner Mannschaft liegen, den Kampf anzunehmen. Gerade im Zentrum hat Pechbrunn vermutlich mit die stärksten Einzelspieler der Liga und mit Grund und Groke brandgefährliche Offensiv-Spieler. „Wir müssen über 90 Minuten dagegenhalten, mit Laufbereitschaft und Robustheit in den Zweikämpfen“, weiß Rasp.\n\nDafür hat er einen hervorragenden Kader an Bord. Auch Routinier David Malzer steht zur Verfügung, der über eine enorme Fitness verfügt und dem Team einen wertvollen Impuls geben kann.","gallery":[{"img":"thi_hoefler","caption":"Spieler wie Tobias Höfler müssen gegen Pechbrunn mit ihrer Physis und Schnelligkeit vorneweggehen."}],"lead":false,"author":"","caption":""},{"id":"sep-vorsitzender","issue":"2026-02","rubrik":"Verein","liga":"Bericht vom Vorsitzenden","date":"2026-09-06","author":"Stefan Wonke, 1. Vorsitzender","title":"Rund ums Gelände: gepflegt, gewalzt, gerüstet","teaser":"Die Herren sind erfolgreich in die Saison gestartet, die A-Jugend spielt Bezirksoberliga. Und für unser FC-Gelände suchen wir helfende Hände.","img":"wonke","caption":"Stefan Wonke, 1. Vorsitzender","body":"Liebe FC-Familie,\n\ndie Herren sind recht erfolgreich in die Saison gestartet, das darf man ganz ohne Understatement so sagen. Dass das kein Zufall ist, sieht jeder, der abends mal am Platz vorbeischaut: Ich stehe selbst mit auf dem Platz und sowohl die Beteiligung als auch die Intensität sind hervorragend.\n\n## Die Jugend steigt ein und sammelt Erfahrung, wo sie am meisten zählt\nParallel starten unsere Jugendmannschaften in Vorbereitung und Saison. Besonders stolz macht uns die A-Jugend, die in der Bezirksoberliga antritt. Hier setzen wir bewusst ein Zeichen: An Spieltagen kommen unsere Jugendspieler ausschließlich in der BOL und nicht bei den Herren zum Einsatz. Der Grund ist so einfach wie überzeugend: In dieser Liga sammeln sie mit Gleichaltrigen enorm viel Erfahrung.\n\n## Nah an den Partnervereinen\nAuch abseits des eigenen Rasens rückt der FC zusammen mit seinen Partnern enger zusammen. Wir sind wieder beim SSV Jahn Regensburg eingeladen und durften am Partnertag mit dabei sein. Außerdem waren wir im August zu Gast bei unserem Partnerverein SpVgg Weiden.\n\nIm Verein haben wir in den vergangenen Wochen einiges bewegt. Der alte B-Platz wurde aufbereitet, damit er uns in den schlechteren Monaten zuverlässig zur Verfügung steht. Und weil nach der Saison bekanntlich vor der Feier ist, laufen bereits die Planungen für unsere Weihnachtsfeier und die Betthupferl-Geschichten.\n\n## Ein Aufruf: Helfer gesucht\nSo schön das alles ist, zum Schluss die wichtigste Botschaft, und die richte ich ganz persönlich an euch. Unser FC-Gelände ist ein Schmuckstück, und genau so soll es bleiben. Aber schön bleibt nur, was gepflegt wird. Das Areal ist inzwischen rund 20 Jahre alt, und Pflege und Aufwand werden Jahr für Jahr mehr.\n\nDeshalb suchen wir Helfer:innen, die uns bei der Platzpflege und den Arbeiten am FC-Gelände tatkräftig unterstützen. Wer immer Lust und ein bisschen Zeit hat, sich für seinen Verein einzubringen: Meldet euch! Ihr seid herzlich willkommen, und der FC weiß jede helfende Hand zu schätzen.\n\nSportliche Grüße\nStefan Wonke, 1. Vorsitzender","lead":false,"gallery":[]},{"id":"sep-wohin-tragen-die-beine","issue":"2026-02","rubrik":"Erste","liga":"Kreisliga","date":"2026-09-06","title":"Wohin tragen die Beine?","teaser":"Die Mannschaften in der Kreisliga sind derzeit wie deutsche Urlauber rund um den Gardasee zur Ferienzeit: alle extrem dicht zusammengedrängt. Zeit für ein erstes Resümee.","img":"sep_erste","caption":"Zuletzt durfte die erste Mannschaft wichtige Siege, wie hier beim 4:0 in Konnersreuth, bejubeln.","body":"Platz acht und Platz drei trennen in der Tabelle gerade mal drei mickrige Pünktchen. Aber nichtsdestotrotz kann man jetzt, mit mehr als einem Monat Spielbetrieb auf dem Tacho, schon ein erstes Resümee zum Saisonauftakt ziehen.\n\nUnsere erste Mannschaft mit dem neuen Trainer Manuel Waller hat jetzt endgültig Fuß gefasst in dieser Spielzeit. Seit fünf Partien ist man Stand Anfang September ungeschlagen, und der Lohn dafür ist eine Platzierung im oberen Tabellendrittel. Nach den anfänglichen Wacklern hat der Trainer es geschafft, das Konstrukt weitestgehend zu stabilisieren. In den vergangenen drei Partien musste Torwart Patrick Rahn nur einmal hinter sich greifen, ausgerechnet beim schmerzhaften Ausgleichstreffer von Ex-Kollege Anthony Hofweller beim unnötigen 1:1-Unentschieden gegen den ASV Wunsiedel. Erfreulich sind aber im Gegenzug die beiden Auswärtssiege in Konnersreuth (0:4) und Weißenstadt (0:3), die man jeweils ohne Gegentreffer aufs eigene Konto buchen konnte.\n\n## Stark wieder treffsicher\nMan kann sich dabei auf einige Konstanten im Kader verlassen. So steht Torjäger Nico Stark nach sieben Partien bereits wieder bei 10 Treffern, was für seine Verhältnisse sogar eher konservative und zurückhaltende Zahlen sind. Auch Keeper Patrick Rahn performt verlässlich auf einem durchgehend hohen Niveau, und Spieler wie Sascha Kollarik, Julian Zant oder Kapitän Bastian Popp sind ohnehin aus der Aufstellung nicht wegzudenken.\n\n## Jugend drängt ins Rampenlicht\nDazu kommen die neuen Impulse unter Coach Waller. Henry Ackermann ist in der Innenverteidigung gesetzt und kommt immer besser mit dem Herrenfußball zurecht. Er durfte zuletzt gegen Weißenstadt sogar den ersten Treffer im Trikot der ersten Mannschaft bejubeln. Zusätzlich waren im Saisonaufgalopp die A-Jugendspieler wertvolle Ergänzungen und vor allem Versprechen für die mittelfristige Zukunft. Tim Männer, der auch schon drei Tore erzielt hat, kann hier stellvertretend genannt werden.\n\nDer September hält eine spannende Mischung an neuen Herausforderungen für die Waller-Truppe bereit. Die erste ist eine, die nicht im eigenen Spielplan, sondern in dem der U19-Jugend wartet. Mit dem regulären Start der Jugend-Runde wird der Einsatz der Nachwuchstalente deutlich eingeschränkt werden. Doch an sich ist dieser Umstand kein Problem, da der Kader genug Alternativen parat hat, die sich im bisherigen Saisonverlauf trainingstechnisch etwas zurückgenommen haben und noch nicht so in Erscheinung getreten sind, wie zum Beispiel der fußballerisch hochbegabte Michael Gmeiner.\n\n## Topspiel gegen Thiersheim\nMit Blick auf die Gegner richtet sich das Auge des geschulten Kreisliga-Experten direkt aufs Duell mit dem TSV Thiersheim. Die Zettl-Elf ist nach der Auftaktniederlage in Konnersreuth eine scheinbar unaufhaltbare Maschine und eilt von Sieg zu Sieg. Das Aufeinandertreffen mit dem wahrscheinlichen Tabellenführer am 20.9. ist die nächste Reifeprüfung für die erste Mannschaft, in der sie bis an ihre Belastungsgrenze gefordert sein wird.\n\n## Spannung hochhalten\nNicht minder wichtig sind aber die Partien rund um dieses Highlight. Es kommt zum Kräftemessen mit den vermeintlich schwächeren Gegnern und Aufsteigern aus Bärnau, Arzberg-Röthenbach und Wiesau. Doch genau wie auf der internationalen Fußballbühne gibt es auch in der Kreisliga keine „Kleinen“ mehr. Bärnau hat schon mit einigen guten Ergebnissen aufhorchen lassen, Wiesau kann immer überraschen und Arzberg-Röthenbach konnte zuletzt die hochklassig besetzte Mitterteicher Reserve schlagen.\n\nDie Devise muss also lauten: Spannung hochhalten und jeden Gegner vernünftig vorbereiten, bespielen und ernst nehmen. Dann kann es ein erfolgreicher September werden, der die erste Mannschaft weiter oben in der Tabelle mitspielen lässt.","gallery":[{"img":"sep_kollarik","caption":"Sascha Kollarik und seine Abwehrkollegen finden immer besser in die Spur, zuletzt gab es deutlich weniger Gegentreffer als in den ersten Spielen der Saison."}],"lead":false,"author":""},{"id":"sep-spitzenstart","issue":"2026-02","rubrik":"Reserve","liga":"Kreisklasse","date":"2026-09-06","title":"Spitzenstart","teaser":"Unsere Reserve kam so gut wie lange nicht aus den Startlöchern. Oben etablieren ist jetzt das Ziel.","img":"sep_reserve","body":"Fußball, oder im Speziellen der Amateurfußball, ist einfach ein wunderbarer Sport. Wenn man einige Jahre zurückdenkt, dann war die Reserve des FC Tirschenreuth regelmäßig in den unteren Tabellenregionen der Kreisklasse zu finden. Einmal musste man sich sogar in der Abstiegsrelegation gegen das Schreckgespenst A-Klasse zur Wehr setzen. Zum Glück war dieses Unterfangen schlussendlich von Erfolg gekrönt.\n\nDoch die Magie des Amateurfußballs besteht darin, dass sich die Dinge relativ schnell ändern können. Nur ein paar Jahre und ein paar gute Jahrgänge später sieht die Situation beim FC Tirschenreuth 2 komplett anders aus. Dank einerseits konsequenter Trainingsarbeit und der nach wie vor lodernden Motivation alter Haudegen und Routiniers und andererseits der wunderbaren Arbeit in der SG-Jugend, die uns mit frischem Blut und neuen Talenten versorgt hat, ist die FC-Reserve Stand heute (Anfang September 2026) zu einer echten Spitzenmannschaft in der Kreisklasse geworden.\n\nTrainer Gerhard Rasp, der sich über die neue Zusammensetzung seines Kaders extrem freut und in der Zusammenarbeit mit dem Chefcoach der ersten Mannschaft, Manuel Waller, Woche für Woche ein Top-Team aufs Feld stellen kann, hat es geschafft, die Mischung aus jungen und erfahrenen Spielern zu einer gut funktionierenden Maschine zu formen.\n\nNach dem Raketenstart in die Saison ist der Lohn aktuell eine Platzierung unter den ersten fünf. Zwischenzeitlich stand man sogar auf dem dritten Tabellenplatz.\n\nMöglich wird dieser kleine Höhenflug durch eine gewinnbringende Mixtur. Die Trainingsleistungen sind die Basis, der Spielerpool tut sein Übriges. Dazu kommt die herausragende Form von einzelnen Spielern. Neuzugang Sandro Culmbacher etwa entwickelt sich mehr und mehr zum fehlenden Puzzlestück der Reserve. Seine Wucht, die er durchs Zentrum von der 10er- oder 8er-Position entwickeln kann, ist ein Element, das der Truppe in den vergangenen Jahren gefehlt hat. In Kombination mit dem enormen Tempo, das die Außenbahnspieler wie Schön, Franz, Gebru Fantaye oder Gutema entwickeln können, wird die Reserve offensiv noch weniger ausrechenbar.\n\nStürmer Benjamin Rath entdeckt dazu immer mehr seinen inneren Nico Stark und trifft in schöner Regelmäßigkeit. Zuletzt jeweils doppelt gegen den ATSV und den FC Lorenzreuth. Auch bei ihm ist nochmal ein deutlicher Schritt nach vorne in der fußballerischen Entwicklung zu sehen.","gallery":[{"img":"sep_bank","caption":"Volles Haus auf der Bank. Gerade in der Saison-Frühphase, in der noch die A-Jugend-Kicker mitwirken können, haben die beiden Trainer die Qual der Wahl."}],"lead":false,"author":"","caption":""},{"id":"sep-coach-wie-laeufts","issue":"2026-02","rubrik":"Erste","liga":"Interview mit Cheftrainer Manuel Waller","date":"2026-09-06","title":"Coach, wie läuft's?","teaser":"Nach wenigen Wochen in Trainer-Verantwortung spielt Manuel Waller bereits die gesamte Emotionsklaviatur wie aus dem Effeff. Ein Gespräch über Zwischenfazit, Spielidee und 400 Spiele für den FC.","img":"sep_waller","caption":"Manuel Waller macht auch am Mikro von anpfiff.info eine gute Figur. Das Anforderungsprofil eines Kreisligatrainers hat sich in den vergangenen Jahrzehnten deutlich gewandelt.","body":"Manuel Waller steht mit verschränkten Armen am Spielfeldrand, tigert in seiner und um seine Coachingzone (die er meist als grobe Richtlinie versteht) auf und ab. Er leidet mit, wirft bei vergebenen Chancen verzweifelt die Arme in die Luft und jubelt bei Treffern seiner Mannschaft ausgelassen mit. Das kommt zum einen von einer doch schon beträchtlichen Erfahrung und zum anderen von der Besonderheit des Projekts, das für ihn eine Art vorläufige fußballerische Vollendung darstellt.\n\n## Seit Mitte Juni stehst du bei der Ersten in der Verantwortung. Die Vorbereitung liegt hinter dir, die ersten Pflichtspiele sind absolviert. Wie fällt dein erstes Zwischenfazit aus?\nMW: „Mein Zwischenfazit fällt insgesamt wirklich gut aus. Die Trainingsbeteiligung und -intensität sind hervorragend, die Jungs ziehen voll mit und es macht mir großen Spaß. Die Stimmung im Team ist sehr gut, auch die Zusammenarbeit mit Hattl klappt hervorragend. Es ist mir auch wichtig, dass die Zweite erfolgreich spielt und im Training Gas gibt. Die Neuzugänge Sandro und Jonas passen sportlich und auch als Typen perfekt ins Team. Auch die aufgerückten A-Jugendspieler tun der Mannschaft gut. Julian Schuller und David Mark machen Fortschritte in der Zweiten und Henry Ackermann hat sich sofort in der Ersten einen Stammplatz erkämpft.\n\nSechs weitere Jugendspieler sind jetzt in der U19-BOL im Einsatz und werden auch in Zukunft immer wieder Einsätze in beiden Herrenteams bekommen, um so den Übergang in den Herrenbereich möglichst problemlos nächste Saison bewältigen zu können.\n\nBei den Spielen gab es Höhen und Tiefen. Ich denke, mit Platz 3 und nur einer Niederlage in sieben Spielen kann man durchaus von einem guten Saisonstart sprechen, auch wenn wir doch einige Punkte bei den Unentschieden verschenkt haben. Einzig wirklich schwache Leistung war gegen Arzberg mit einer verdienten Niederlage.“\n\n## Welche Art Fußball möchtest du sehen lassen, und wie viel davon erkennst du nach den ersten sieben Spielen schon auf dem Platz?\nMW: „Meine Wunschvorstellung wäre in Ballbesitz eine schnelle und flache Spieleröffnung, mit viel Tempo und Bewegung und schnelles Passspiel in die Spitze. Gegen den Ball aggressiv, giftig, hohe Laufbereitschaft, kompakt, enge Abstände und dann nach Balleroberung schnell umschalten.\n\nInsgesamt sehen wir davon schon immer wieder einiges, aber noch viel zu inkonstant, und wir bringen es meistens nicht über 90 Minuten durch. Aber es ist schon viel besser geworden.“\n\n## Wenn du auf den bisherigen Saisonverlauf blickst: Welche Ziele willst du mit den Jungs in dieser Runde erreichen?\nMW: „Wir haben gezeigt, dass wir gegen jeden Gegner mithalten können, aber auch gegen jeden Probleme bekommen, wenn wir unsere Potenziale nicht abrufen. Daher ist das Ziel, uns spielerisch und taktisch so zu verbessern, dass unsere Leistung konstant abgerufen werden kann. Hierzu bedarf es etwas Geduld. Außerdem ist das Ziel, die jungen Spieler immer wieder einzusetzen, sofern es der A-Jugend-Spielplan und Belastung erlauben. Da ich sehe, wie alle, jung und „alt“, im Training Gas geben, mache ich mir da auch keine Sorgen.\n\nMit welcher Platzierung dies dann enden wird, werden wir sehen, zumal es heuer sehr viele Mannschaften gibt, die aufgerüstet haben. Aber vorne mitmischen will ich schon.“\n\n## Du hast in deiner aktiven Zeit auch einige Trainer erlebt. Hat dich einer davon besonders beeinflusst und wie hat sich der Job „Kreisliga-Trainer“ seitdem verändert?\nMW: „Schwere Frage, weil ich sehr viele Trainer hatte und jeder anders war. Mit Klaus Bauer konnte ich als 18-Jähriger selbst miterleben, wie man den Mut haben kann, auf junge Spieler zu setzen. Gerhard Nothaft war auch ein Top-Trainer, aber am meisten habe ich von dem leider schon verstorbenen Rudi Tragl mitgenommen. Wahrscheinlich aber auch, weil ich da schon in einem Alter war, wo ich selbst schon ein bisschen wie ein Trainer dachte, und ich mir daher wohl auch am meisten Gedanken über Trainingssteuerung und Methodik gemacht habe.\n\nOb sich viel geändert hat zu früher, kann ich schwer sagen. Mit Sicherheit schon, was Präsenz in den Medien, Internet, Social Media anbelangt, aber leider auch, was die vielen anderen Freizeitmöglichkeiten für die Spieler anbelangt. Früher gab's halt nur „Fußball“.\n\nAber letztlich geht's wie schon seit Jahrzehnten immer um intensive Trainingsarbeit, gute Vorbereitung zum Spiel, Coaching und Kommunikation, das wird sich nie ändern. Die Phrase „Entscheidend ist auf dem Platz!“ wird immer gelten.“\n\n## Du hast selbst über 400 Spiele für den FC Tirschenreuth bestritten. Welcher Moment aus deiner aktiven Zeit ist dir am lebhaftesten in Erinnerung geblieben?\nMW: „Da gab's natürlich etliche Momente, aber was am meisten in Erinnerung bleibt, hat natürlich mit dem ersten Aufstieg des FC in seiner Geschichte in die Bezirksliga zu tun. Diese Bezirksliga-Saison bleibt in Erinnerung, vor allem das allererste Spiel in Gesees, als wir 90 Minuten in einer Abwehrschlacht den Dauerdruck abwehren konnten (1:1), und wir dann einige Wochen später sogar nach einem Sieg in Mainleus als Tabellenführer der Bezirksliga mit dem Bus nach Hause fuhren, entsprechende Partystimmung inklusive.“\n\n## Du trainierst parallel noch die A-Jugend. Diesen Jahrgang begleitest du seit Jahren. Was bedeutet dir diese Verbindung und was können wir in Zukunft von den jungen Talenten erwarten?\nMW: „Dieser Jahrgang bedeutet mir sehr viel, weil ich fast alle Spieler seit über zehn Jahren begleiten und ihre Entwicklung von Bambini bis Herrenfußball fördern durfte. Da dürfen wir uns mit Tim Männer, Felix Gebhard, Julian Gründel, Paul Mayer, Maximilian Benesch und Simon Waller auf sechs Talente freuen. Wenn die Jungs zusammenbleiben, was ich natürlich sehr, sehr stark hoffe, werden diese Spieler die Mannschaft in den nächsten Jahren bereichern, weil es alles prima Kerle sind mit Potenzial, was man bei ihren bisherigen Einsätzen schon gesehen hat, auch wenn sie natürlich noch sehr viel lernen müssen.“\n\n## Letzte Frage: Meinst du, du könntest zur Not nochmal selbst das Trikot überstreifen und aushelfen, wenn Not am Mann ist?\nMW: „Klares Nein, viel zu alt und langsam und unbeweglich!“\n\n## Quick Fire Questions\nZu Null hinten oder Torfestival vorne? MW: „Zu Null“\nEmotional an der Seitenlinie oder eiskalt-analytisch? MW: „Zum Fußball gehören Emotionen, aber auch eine gute Vorbereitung zum Spiel. Somit emotional und analytisch, aber nie eiskalt“\nBallbesitz oder Umschaltspiel? MW: „Bin Fan von beiden und schließt sich auch nicht aus.“\nMessi oder Ronaldo? MW: „Eigentlich keiner von beiden, eher Ronaldo“\nWen siehst du derzeit öfter, deine Frau oder deine Mannschaft(en)? MW: „In der Vorbereitung der Herren und A wahrscheinlich eher die Mannschaften. Seit dieser Woche (Vorbereitung A vorbei) sollte es wieder mehr meine Frau werden, die mich Gott sei Dank hier großartig unterstützt, sonst ginge das alles gar nicht.“\nDu trainierst Champions League: Anzug oder Trainingsjacke auf der Bank? MW: „Ganz klar Anzug!“\n\n## Steckbrief\nName: Manuel Waller\nAlter: 47 Jahre\nStationen als Spieler: FC Tirschenreuth (bis 2012), SG Großkonreuth (Spielertrainer 2012 bis 2015)\nStationen als Trainer: SG Tirschenreuth (seit 2014 in verschiedenen Funktionen), SG Griesbach/Großkonreuth/Mähring (2015 bis 2024), FC Tirschenreuth (seit 2026)","gallery":[{"img":"sep_abschied","caption":"Vor 14 Jahren wurde Manuel Waller als aktiver Spieler verabschiedet. Sein Weg führte ihn danach zur SG Griesbach, parallel dazu war und ist er im Jugendbereich der SG Tirschenreuth als Betreuer, Co-Trainer und Trainer aktiv."},{"img":"sep_u19","caption":"Mit der U19 der SG Tirschenreuth hat Manuel Waller mit seinem Co-Trainer Thomas Koller den Aufstieg in die Bezirksoberliga geschafft. Viele Talente spielen bereits parallel bei den Herren."}],"lead":false,"author":""},{"id":"sep-neuzugaenge-jugend","issue":"2026-02","rubrik":"Jugend","liga":"Neuzugänge aus der A-Jugend","date":"2026-09-06","title":"Neuzugänge aus der eigenen Jugend","teaser":"Drei junge Gesichter sind im Sommer in den Herrenbereich aufgerückt. Für beide Mannschaften echte Verstärkungen.","img":"","caption":"","body":"Frisches Blut tut Fußballmannschaften per se einfach gut. Wenn die Neuzugänge dann noch aus der eigenen Jugend kommen, ist das gleich noch besser. Und wenn sie für beide Mannschaften echte Verstärkungen sein können, dann ist das eine Win-Win-Situation.\n\nSo geschehen bei unseren drei jungen Gesichtern, die im Sommer dieses Jahres in den Herrenbereich aufgerückt sind. Nachdem sie schon im Jahr zuvor ab und zu im Kader der Senioren aufgetaucht sind, gehören sie jetzt fest zum Team. Und die ersten Saisonwochen machen auch Lust auf mehr und zeigen auf, wie gut in unserer SG-Jugendabteilung gearbeitet wird.\n\nHenry Ackermann hat es zum Beispiel auf Anhieb in die Stammelf der ersten Mannschaft geschafft, Julian Schuller war bereits regelmäßig bei der Reserve im Einsatz. David Mark kommt derweil aus einer langwierigen Verletzung zurück und durfte zuletzt sein Comeback auf dem Platz feiern.\n\n[bild]\n\n## Henry Ackermann\nPosition: Innenverteidigung\nAlter: 19 Jahre\nStarker Fuß: rechts\nStationen in der Jugend: FC Tirschenreuth, SG Tirschenreuth\nFußballerisches Vorbild: Sergio Ramos\nSaisonziel im ersten Herrenjahr: „Konsequente Abwehrleistungen bringen!“\n\n[bild]\n\n## David Mark\nPosition: Linker und rechter Flügel\nAlter: 19 Jahre\nStarker Fuß: links\nStationen in der Jugend: TSV Bärnau, SG Tirschenreuth\nFußballerisches Vorbild: Paulo Dybala\nSaisonziel im ersten Herrenjahr: „An die körperlichen Herausforderungen anpassen und verletzungsfrei bleiben!“\n\n[bild]\n\n## Julian Schuller\nPosition: Innenverteidigung\nAlter: 19 Jahre\nStarker Fuß: links\nStationen in der Jugend: SG Tirschenreuth, JFG FC Stiftland, SV Mitterteich\nFußballerisches Vorbild: Virgil van Dijk\nSaisonziel im ersten Herrenjahr: „Mich weiterentwickeln und die Mannschaft unterstützen!“","gallery":[{"img":"por_ackermann","caption":"Henry Ackermann","portrait":true},{"img":"por_mark","caption":"David Mark","portrait":true},{"img":"por_schuller","caption":"Julian Schuller","portrait":true}],"lead":false,"author":"","thumb":"por_ackermann"},{"id":"sep-jahn-partnertag","issue":"2026-02","rubrik":"Verein","liga":"Partnerverein SSV Jahn","date":"2026-09-06","title":"Andenken an den Jahn-Partnertag","teaser":"Bereits zum fünften Mal lud der SSV Jahn Regensburg seine Partnervereine ein. Der FC Tirschenreuth war mittendrin statt nur dabei.","img":"sep_jahn","body":"Bereits zum fünften Mal lud der SSV Jahn Regensburg seine Partnervereine zum „Tag der Jahn Partnervereine“. Und am 28.06.2026 war der FC Tirschenreuth mittendrin statt nur dabei. Gastgeber war diesmal der TuS Pfakofen, auf dessen Sportgelände sich neben den Profis aus Regensburg drei Amateurvereine einfanden: die Hausherren aus Pfakofen, der ASV Burglengenfeld und unsere Truppe. Gespielt wurde in einem kompakten Turnierformat mit Halbfinals à 45 Minuten und einem abschließenden Finale. Für die Schwarz-Gelben war im Halbfinale gegen den ASV Burglengenfeld Endstation.\n\nRund um den Platz war zudem einiges geboten: Das Jahn-Fanmobil mit Torwand lockte mit Trikots, Bällen und Tickets, für den Nachwuchs stand eine Hüpfburg bereit, und ein Teil der Einnahmen floss in die soziale Initiative „Brücken für Regensburg“. „Der Tag der Jahn Partnervereine ist für uns weit mehr als ein gewöhnlicher Saisonstart, er ist gelebte Tradition und Ausdruck unserer tiefen Verwurzelung in Ostbayern“, brachte es Jahn-Sportdirektor Alexander Schmalhofer auf den Punkt.\n\nDamit war die Geschichte aber noch nicht zu Ende. Im Nachgang bedankten sich die sehr umsichtigen und angenehmen Gastgeber nochmal speziell bei den teilnehmenden Vereinen in Form eines Leinwanddrucks des gemeinsamen Abschlussfotos. Zudem ließ man es sich nicht nehmen, die Geschenke persönlich zu übergeben. So machte sich Stephan vom TuS Pfakofen Ende August auf in die nördliche Oberpfalz und traf unseren 2. Vorstand Thomas Kruppa in Tirschenreuth. Man tauschte sich kurz über die gelungene Veranstaltung aus und ging mit dem Ziel auseinander, sich bei einem möglichen gegenseitigen Vereinsbesuch in Form eines Spiels der Ü32-Mannschaften ein weiteres Mal zu treffen.","lead":false,"author":"","caption":"","gallery":[]},{"id":"sep-fc-kids","issue":"2026-02","rubrik":"Jugend","liga":"Kinderfußball","date":"2026-09-06","title":"FC-Kids","teaser":"Der Nachwuchs kann gar nicht aufhören, daheim im Garten an den Ball zu treten, und will immerzu kicken? Dann ab zum FC!","img":"sep_kids","body":"Wir kümmern uns um die fußballerische Ausbildung der Jugend und nehmen die Kinder mit viel Spaß am Spiel altersgerecht an die Hand und begleiten sie. Dafür stehen unsere lizenzierten Kinder- und Jugendtrainer bereit, die in den Altersklassen G- bis E-Jugend unsere Teams betreuen.\n\nBei Fragen und für Infos rund um den Kinderfußball steht unser Jugendleiter Marco Schwägerl bereit. Mobil: 0160 94829230","lead":false,"author":"","caption":"","gallery":[]},{"id":"ja-vorwort","issue":"2026-01","rubrik":"Verein","liga":"Vorwort vom Vorsitzenden","date":"2026-07-26","title":"Frischer Wind an der Seitenlinie","teaser":"Mit Manuel Waller steht ein neuer Trainer an der Linie der Ersten. Und mit dem 4:4-Spektakel in Waldershof ging die Saison schon mal vielversprechend los.","img":"wonke","caption":"Stefan Wonke, 1. Vorsitzender","body":"Liebe Sportfreunde,\n\nals am 19. Juli in Waldershof für uns die neue Spielzeit in der Kreisliga beziehungsweise in der Kreisklasse begann, gab es einige Neuerungen im Vergleich zum Auftaktspiel der vergangenen Saison.\n\nDie augenscheinlichste Neuerung steht an der Seitenlinie. Nach den erfolgreichen Jahren mit Udo Schnurrer als Trainer der ersten Mannschaft gab es in diesem Sommer einen Wechsel auf der taktischen Kommandobrücke. Ab sofort trägt Manuel Waller dort die Verantwortung. Als altgedienter FC-Herrenspieler und langjähriger Jugend- sowie Herrentrainer im Spielkreis lebt, denkt und atmet er Fußball durch und durch. Wir sind sehr froh, dass er sich dazu entschieden hat, diese Herausforderung anzunehmen und das Traineramt zu übernehmen.\n\nMit ihm kam sofort frischer Wind in die Einheiten und auch ins Personalkarussell. Denn nach dem Abgang von Anthony Hofweller und dem Ausfall von Manuel Dürbeck braucht es neue Gesichter, die schnell Verantwortung übernehmen. Zuallererst denkt man natürlich an Routiniers wie Kapitän Bastian Popp oder den Kreisliga-MVP der vergangenen Saison, Nico Stark. Doch auch junge Kicker drücken aufs Gaspedal und bekommen ihre Chance. Das hat die Vorbereitung mehr als deutlich gezeigt.\n\nJetzt beginnt der Ernst des Fußballerlebens aufs Neue. Mit dem 4:4-Spektakel in Waldershof ging die Saison schon mal vielversprechend los.\n\nWir freuen uns auf die nächsten Spiele!","lead":false,"author":"Stefan Wonke, 1. Vorsitzender","gallery":[{"img":"ja_waller","caption":"Bekannte Pose, neues Gesicht: Mit Manuel Waller kehrt ein echter FC-ler an die Linie zurück, der eine klare Idee hat, welchen Fußball er spielen lassen möchte."}]},{"id":"ja-a-new-hope","issue":"2026-01","rubrik":"Erste","liga":"Kreisliga","date":"2026-07-26","title":"A New Hope","teaser":"Die Kreisliga hat Fahrt aufgenommen, und zwar ohne langen Anlauf. Für die Truppe von Manuel Waller war es trotz des „verspielten“ Sieges in Waldershof ein hoffnungsvoller Auftakt.","img":"ja_rahn","caption":"Kreisliga-Ironman Patrick Rahn hat in seiner Herren-Karriere noch kein Spiel verpasst und ist einer der besten Torhüter der Liga geworden.","body":"Beim Auftaktspiel gegen den Topfavoriten aus Waldershof sahen die Zuschauer sofort wieder das, was die Partie bereits in der jüngeren Vergangenheit immer versprochen hatte: höchste Intensität.\n\nVeränderungen sind in der Regel mit Schmerzen oder, sagen wir zumindest, mit Anpassungsschwierigkeiten verbunden. Das deutete sich auch in der Vorbereitung der ersten Mannschaft auf die aktuelle Saison an. Mit Manuel Waller bat ein neuer Trainer, der eine klare Idee und feste Prinzipien verfolgt, einen ganzen Haufen motivierter junger und jung gebliebener Fußballer Mitte Juni zum Trainingsauftakt in den Sportpark. Von Beginn an war der Zauber des Aufbruchs zu verspüren: die Intensität in jeder Spielform und von Zeit zu Zeit auch ein wenig positive Überforderung aufgrund der neuen, ungewohnten Übungen und Abläufe. Der Zug, die Beteiligung und die Stimmung in der Truppe stimmten. Nur die Ergebnisse nicht.\n\n## Ergebniskrise in der Vorbereitung\nKeines der Testspiele konnte gewonnen werden, und eine Woche vor dem Saisonstart setzte es eine 1:6-Pleite im Vorbereitungsspiel-Clásico gegen den TSV Erbendorf. Die Alarmglocken schrillten leise in den Köpfen der Verantwortlichen, und es gingen durchaus bange Blicke in Richtung des Knallers gegen den TSV Waldershof, immerhin Absteiger und Titelfavorit Nummer eins.\n\n## Furioser FC-Start\nDoch dann zeigte die Mannschaft eine starke Reaktion. Der Trainer kam mit einem klaren Plan an den Fuß der Kösseine und hatte seine Truppe glänzend auf die Wucht der Gastgeber eingestellt. Aus einem tieferen Block heraus und mit einer wahnsinnigen Intensität bespielte der FC die Gastgeber und setzte immer wieder tödliche Nadelstiche. Topstürmer Nico Stark stellte seinen persönlichen Tore-Tacho schnell auf eins, und der hochbegabte Jugendspieler Tim Männer traf in seinem ersten Spiel bei den Herren gleich doppelt, sodass man mit einer hochverdienten 3:0-Führung in die Pause ging.\n\nNach dem Wechsel drückte der TSV Waldershof dann aufs Gas und schnürte die junge FC-Truppe immer stärker in der eigenen Hälfte ein. Durch zwei unglückliche Eigentore, einen perfekten Freistoß und einen weiteren Treffer konterten die Gastgeber die FC-Führung und glichen am Ende zum 4:4 aus. Nico Stark hatte zwischenzeitlich auf 4:2 stellen können. Am Ende rettete FC-Keeper Rahn im Verbund mit Michael Gmeiner, der eigentlich nicht für seine Defensivqualitäten bekannt ist, den Punkt.\n\n## Top-Stürmer im direkten Duell\nInteressant war auch das Duell der beiden wahrscheinlich stärksten Angreifer der Liga. Auf der einen Seite Julian Schindler, der mit seiner körperlichen Präsenz mindestens zwei Verteidiger an sich abprallen lassen kann und im Sechzehner eine derart brachiale Gewalt entwickelt, dass er kaum zu halten ist. Auf der anderen Seite Nico Stark, der mit seiner Athletik und seinem Antritt den Verteidigern noch nachts in ihren schlimmsten Albträumen davonlaufen kann.\n\nSo bleiben am Ende eine wirklich gute erste Halbzeit sowie der Ärger über die zweiten 45 Minuten und den verpassten Big Point. Dennoch kann der Trainer mit der Reaktion seines Teams auf die holprige Vorbereitung zufrieden sein.\n\n## Spannendes Auftaktprogramm\nJetzt geht es Schlag auf Schlag, und die nächsten Topteams kommen dem FC vor die Flinte: der rückzugsfreudige VfB Arzberg, der nach dem kuriosen Saisonfinale 2025/26 erneut in der Kreisliga antreten darf, und danach der runderneuerte VfB Rehau. Erst nach den kommenden Wochen lässt sich absehen, wohin die Reise für Manuel Waller und seine Mannschaft in diesem Jahr des Umbruchs gehen kann.","lead":false,"author":"","gallery":[]},{"id":"ja-reserve-potenzial","issue":"2026-01","rubrik":"Reserve","liga":"Kreisklasse","date":"2026-07-26","title":"Mit einer Menge Potenzial","teaser":"Die FC-Reserve startet nach einer erfolgreichen Vorsaison durchaus mit Ambitionen und konnte zum Auftakt gleich gegen einen selbsternannten Mitfavoriten punkten, auch wenn mehr drin gewesen wäre.","img":"ja_reserve","caption":"Lukas Schön (links) ist mittlerweile schon ein Routinier und soll mit seiner Klasse und Schnelligkeit für Gefahr sorgen.","body":"Auch in der Kreisklasse rollt das Bällchen wieder. Und wie quasi jedes Jahr wird von einer extrem ausgeglichenen und hochkarätig besetzten Liga gesprochen.\n\n„Ich ärgere mich ein bisschen. Waldershof war auf jeden Fall schlagbar“, resümierte Reservetrainer Gerhard Rasp nach dem 1:1-Remis seiner Jungs gegen die Zweitvertretung des TSV Waldershof. Die Gastgeber vom Hammerrang hatten im Vorfeld der neuen Spielzeit selbstbewusst durchklingen lassen, dass sie sich gute Chancen ausrechnen, ganz oben mitzuspielen.\n\nSo offensive Kampfansagen gab es beim FC zwar nicht. Dennoch ist klar, dass die Rasp-Truppe nicht antritt, um gegen den Abstieg zu spielen. Platz sechs im Vorjahr und erneut wertvolle Verstärkungen aus der eigenen Jugend machen durchaus Mut. So kam mit Julian Schuller ein technisch begabter Linksfuß als zusätzliche Option für die Innenverteidigung dazu. Auch Julian Gründel aus der SG drängt in Richtung Startformation. Hinzu kommen derzeit einige talentierte A-Jugendliche. Gemeinsam mit den Routiniers, die alle an Bord geblieben sind, steht dem Trainer damit eine gute Mischung zur Verfügung, die sich allerdings erst noch finden muss.\n\n## Schnelle Führung, schneller Ausgleich\nDas wurde auch beim Auftakt deutlich. Die Führung durch Reserveknipser Ben Rath fiel zwar früh, hielt aber nur wenige Minuten. Danach entwickelte sich ein offener Schlagabtausch, den beide Teams für sich hätten entscheiden können. Bei zwei Aluminiumtreffern des Gegners hatte die FC-Reserve allerdings auch das nötige Quäntchen Glück auf ihrer Seite.\n\n## Interessante Gegner zu Beginn\nDer Spielplan im Juli und August hält nun durchaus spannende Herausforderungen bereit. Zunächst kommt der SV Poppenreuth, der nach der Auflösung seiner ersten Mannschaft von Grund auf erneuert sein dürfte. Danach geht es gegen die stets ambitionierte SG Neualbenreuth/Waldsassen und die junge, hungrige Truppe des SV Steinmühle, die ihr Auftaktspiel mit 10:0 gewonnen hat.\n\nBlicke in die Glaskugel oder Orakelsprüche über den weiteren Verlauf der Saison sind an dieser Stelle noch nicht angebracht. Der Trainer weiß allerdings, welches Potenzial in der Mannschaft steckt. Wenn die Jungs es schaffen, ihre Möglichkeiten auszuschöpfen, und sich relativ schnell eine eingespielte Formation entwickelt, ist gegen jeden Gegner in dieser Liga ein Erfolg möglich.\n\nIn diesem Sinne: Schauen wir mal, was wird!","gallery":[{"img":"ja_rasp","caption":"Mit Gerhard Rasp setzt der FC auf dem Reserven-Trainerposten auf Kontinuität. Der erfahrene Übungsleiter hat nach wie vor enorme Energie und freut sich auf eine spannende Serie mit seiner Truppe."}],"lead":false,"author":""},{"id":"ja-maedels-im-einsatz","issue":"2026-01","rubrik":"Damen","liga":"Hobbyliga","date":"2026-07-26","title":"Mädels im Einsatz","teaser":"Unsere Damenmannschaft ist höchst erfolgreich in die neue Saison gestartet. In den ersten beiden Spielen der Hobbyliga gab es jeweils die volle Punktzahl.","img":"ja_damen","body":"Den Auftakt im Sportpark gewann die Mannschaft von Trainerlegende Max Burger mit 1:0 gegen den SV Störnstein. In einer Partie, in der die Mädels dem Gegner klar überlegen waren, gab es lediglich an der Chancenverwertung etwas zu kritisieren.\n\nDas folgende Spiel in Mantel dagegen war ein echter Kampf mit viel körperlichem Einsatz. Am Ende konnten die Mädels dennoch erneut jubeln. Mit dem 3:2-Auswärtssieg machten sie den makellosen Saisonstart perfekt.","lead":false,"author":"","caption":"","gallery":[]},{"id":"ja-jugend-on-tour","issue":"2026-01","rubrik":"Jugend","liga":"Kleinfeld","date":"2026-07-26","title":"FC-Jugend on Tour","teaser":"Es weht ein frischer Wind in unserer Jugendabteilung. In den unteren Jugendmannschaften laufen so viele Kids wie schon lange nicht mehr über die Spielfelder im Sportpark.","img":"ja_jugend1","caption":"Egal ob in Konnersreuth, Wiesau oder Waldsassen, die FC-Nachwuchsteams sind überall ein gern gesehener Gast bei Turnieren und Spielen.","body":"Nach langen Jahren, in denen sich unser Jugendleiter Marco Schwägerl angesichts der rückläufigen Zahlen von Spielerinnen und Spielern durchaus Sorgen machte, geht es nun wieder bergauf. In den unteren Jugendmannschaften, also von der G- bis zur E-Jugend, in denen wir eigenständige Teams am Start haben, laufen so viele Kids wie schon lange nicht mehr über die Spielfelder im Sportpark.\n\n## Trainerteam mit Top-Arbeit\nDem großen persönlichen Einsatz von Marco und seinem Trainerteam ist es zu verdanken, dass die mittelfristige Zukunft in Schwarz-Gelb wieder rosiger aussieht. Regelmäßig sorgen die Nachwuchsteams für positive Schlagzeilen und sind häufig bei Turnieren in der gesamten Region unterwegs.\n\nDas Trainerteam erhielt vor Kurzem zudem weitere Unterstützung durch Spieler der Herrenmannschaft. Sogar die Damenmannschaft beteiligt sich an der Ausbildung der nächsten Generation von FC-Talenten.\n\nWeiter so, Jungs und Mädels!\n\nBei Fragen und für Infos rund um den Kinderfußball steht unser Jugendleiter Marco Schwägerl bereit. Mobil: 0160 94829230","gallery":[{"img":"ja_jugend2","caption":"Am Ende geht's doch irgendwie ums Gewinnen! Unsere Kickerinnen und Kicker freuen sich jedenfalls über jeden Treffer und jeden Sieg."},{"img":"ja_jugend3","caption":"Auch unser Jugendleiter Marco Schwägerl steht an der Seitenlinie. Derzeit betreut er die E-Junioren gemeinsam mit einem starken Team."}],"lead":false,"author":""},{"id":"ja-eisstock-international","issue":"2026-01","rubrik":"Verein","liga":"Eisstock","date":"2026-07-26","title":"FC-Eisstock international","teaser":"Vom 4. bis 7. Juni fanden rund um den Millstätter See die 34. Internationalen Stocksporttage in Seeboden statt. Auch die Stockschützen des FC waren dabei.","img":"ja_stock","body":"Vom 4. bis 7. Juni 2026 fanden rund um den Millstätter See die 34. Internationalen Stocksporttage in Seeboden statt. Mannschaften aus mehreren europäischen Ländern traten dabei in verschiedenen Wettbewerben gegeneinander an. Auch die Stockschützen des FC waren bei dem traditionsreichen Turnier vertreten.\n\nDen sportlichen Auftakt bildete am Freitag das Duo-Turnier. Für David Prokesch und Marco Schwägerl ging es dafür auf die Stocksportanlage nach Feffernitz. Dort wurde allerdings schnell deutlich, dass an diesem Tag nicht nur die Gegner eine Herausforderung darstellen würden. Aufgrund des anhaltenden Regens musste der Turnierbeginn mehrfach verschoben werden. Erst um 14.30 Uhr konnte unter anspruchsvollen Bedingungen mit dem Wettbewerb begonnen werden.\n\nUm trotz der Verzögerungen möglichst viele Begegnungen durchführen zu können, wurden pro Spiel lediglich vier Kehren absolviert. Doch auch diese Anpassung konnte den Turniertag nicht retten: Um 17.30 Uhr musste der Wettbewerb nach sechs von ursprünglich 14 geplanten Spielen endgültig abgebrochen werden. Für unsere beiden Schützen war es dennoch eine besondere Erfahrung, sich im internationalen Teilnehmerfeld zu messen.\n\nEine unerwartete Gelegenheit ergab sich am folgenden Samstag. Kurzfristig suchte die Sportunion Neustift noch Stockschützen für ihre Mannschaft beim Herrenturnier. Unsere Schützen zögerten nicht lange und nutzten spontan die Möglichkeit, gemeinsam mit einigen Top-Schützen aus der österreichischen Staatsliga anzutreten. Die neu zusammengestellte Mannschaft harmonierte auf Anhieb gut und konnte sich in einem hochkarätigen Teilnehmerfeld behaupten. Am Ende erreichte das Auswahlteam einen starken vierten Platz in seiner Gruppe.\n\nNeben den sportlichen Wettbewerben kam auch der Austausch zwischen den Vereinen nicht zu kurz. Während der Turniertage entstand ein besonders guter Kontakt zu den Stockschützen der TG Königsmoos. Aus vielen Gesprächen und gemeinsamen Stunden entwickelte sich eine neue Vereinsfreundschaft, die bei der Siegerehrung am Samstagabend auch mit einem gemeinsamen Foto festgehalten wurde.\n\nFür den FC waren bei den Internationalen Stocksporttagen David Prokesch, der erste Vorsitzende der Sparte Eisstock, und Marco Schwägerl als aktiver Schütze mit dabei. Trotz des regnerischen Wetters und des vorzeitigen Turnierabbruchs am Freitag bleiben viele sportliche Eindrücke, neue Kontakte und eine gelungene gemeinsame Zeit in Erinnerung.","gallery":[{"img":"ja_stock2","caption":""}],"lead":false,"author":"","caption":""},{"id":"ja-spendenuebergabe-legat","issue":"2026-01","rubrik":"Verein","liga":"Spendenübergabe","date":"2026-07-26","title":"850 Euro von EDEKA Legat","teaser":"Über die Wintermonate durften wir am Vereins-Card-Programm von EDEKA Legat teilnehmen. Im Juli gab es den Scheck.","img":"ja_legat","body":"Über die Wintermonate durften wir am Vereins-Card-Programm von EDEKA Legat teilnehmen. Für jeden Einkauf, der über unsere digitale Präsenz in der Legat-eigenen App unserem Verein zugeordnet wurde, erhielten wir einen kleinen Anteil auf unserem „Konto“ gutgeschrieben.\n\nBei der Spendenübergabe im Juli durften unser stellvertretender Vorsitzender Thomas Kruppa und die Vorsitzende unseres Fördervereins, Kathrin Schramm, einen stolzen und großformatigen Scheck über 850 Euro entgegennehmen.\n\nWir bedanken uns herzlich bei der Familie Legat sowie bei allen Unterstützern und Vereinsfreunden, die dazu beigetragen haben, dass die Aktion zu einem beachtlichen Erfolg wurde.","lead":false,"author":"","caption":"","gallery":[]}],"band":{"title":"Das Heft zum Monat","text":"Das Sportpark Journal erscheint jeden Monat gedruckt und liegt bei jedem Heimspiel im Sportpark aus. Hier online findet ihr alle Berichte, die Spielpläne und die Bilder zum Nachlesen.\n\nNoch näher dran seid ihr auf unseren Social-Media-Kanälen: Spieltagsgrafiken, Startelf, Ergebnisse und alles, was zwischen den Ausgaben passiert."},"footer":{"claim":"Das Stadionmagazin des FC Tirschenreuth 1950 e.V.","impressum":"Herausgeber: FC Tirschenreuth 1950 e.V.\nMähringer Str. 30, 95643 Tirschenreuth\nVertreten durch den 1. Vorsitzenden Stefan Wonke\nV.i.S.d.P.: Stefan Wonke (Anschrift wie oben)\nRedaktion und Texte: Alexander Schirmer, Thomas Kruppa, Stefan Wonke\nFotos: photoloni, Sportfotografie Melanie Miedl, Thomas Schrems, anpfiff.info, axs, privat"},"images":{"cover":"img/cover.jpg","erste":"img/erste.jpg","rahn":"img/rahn.jpg","reserve":"img/reserve.jpg","mark":"img/mark.jpg","damen":"img/damen.jpg","grill":"img/grill.jpg","fjugend":"img/fjugend.jpg","pokal":"img/pokal.jpg","sieben":"img/sieben.jpg","fteam":"img/fteam.jpg","hz1":"img/hz1.jpg","hz2":"img/hz2.jpg","hz3":"img/hz3.jpg const RUBRIKEN = ["Erste","Reserve","Damen","Jugend","Verein"];
const RUBRIK_LANG = {Erste:"Erste Mannschaft",Reserve:"Zweite Mannschaft",Damen:"Damenmannschaft",Jugend:"Nachwuchs",Verein:"Vereinsleben"};
const MAX_BYTES = 15500000;

let state = JSON.parse(document.getElementById("state").textContent);
let dirty = false, artifactNS = null, canEdit = false, busy = false;
let deskTab = "berichte", editingId = null, fxTab = 0;

const root = document.getElementById("root");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = k => (k && state.images[k]) || "";
const fp = k => ' style="object-position:' + esc((state.focus && state.focus[k]) || "50% 25%") + '"';
const byId = id => state.articles.find(a => a.id === id);
const issueById = id => state.issues.find(i => i.id === id);
const curIssue = () => issueById(state.currentIssue) || state.issues[0] || {id:"", label:"", type:"Ausgabe"};
const issuesSorted = () => state.issues.slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
const TYPE_LANG = {Ausgabe:"Ausgabe", Matchday:"Matchday Spezial"};
const isChair = a => /vorsitzend/i.test(a.liga || "") && !!state.chairImg;
const coverKey = a => isChair(a) ? state.chairImg : (a.img || a.thumb);
function issueTag(a, link){
  const iss = issueById(a.issue); if(!iss) return "";
  const t = "Aus " + iss.label;
  return '<p class="itag' + (iss.type === "Matchday" ? " md" : "") + '">' + (link ? '<a href="#/archiv">' + esc(t) + '</a>' : esc(t)) + '</p>';
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
}
function blockHTML(block){
  const lines = block.split("\n");
  let out = "";
  if(lines[0].startsWith("## ")){ out += "<h3>" + esc(lines.shift().slice(3)) + "</h3>"; }
  if(lines.length) out += "<p>" + lines.map(esc).join("<br>") + "</p>";
  return out;
}
function bodyHTML(a, first){
  const blocks = String(a.body || "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const gal = (a.gallery || []).filter(g => g.img && state.images[g.img]);
  let gi = 0;
  const lead = first ? '<figure class="inl right portrait"><img src="' + img(first.img) + '" alt="' + esc(first.caption) + '"><figcaption class="cap">' + esc(first.caption) + '</figcaption></figure>' : "";
  const fig = g => { const side = (gi + (first ? 1 : 0)) % 2 ? "left" : "right"; gi++;
    return '<figure class="inl ' + side + (g.portrait ? " portrait" : "") + '"><img src="' + img(g.img) + '"' + fp(g.img) + ' alt="' + esc(g.caption || "") + '" loading="lazy">' + (g.caption ? '<figcaption class="cap">' + esc(g.caption) + '</figcaption>' : "") + '</figure>'; };
  const out = [];
  if(blocks.some(b => b === "[bild]")){
    blocks.forEach(b => { if(b === "[bild]"){ if(gi < gal.length) out.push(fig(gal[gi])); } else out.push(blockHTML(b)); });
  } else {
    const B = blocks.length, n = gal.length, at = {};
    for(let k = 0; k < n; k++){ const p = Math.max(1, Math.floor((k + 1) * B / (n + 1))); (at[p] = at[p] || []).push(gal[k]); }
    blocks.forEach((b,i) => { (at[i] || []).forEach(g => out.push(fig(g))); out.push(blockHTML(b)); });
    Object.keys(at).filter(p => +p >= B).forEach(p => at[p].forEach(g => out.push(fig(g))));
  }
  while(gi < gal.length) out.push(fig(gal[gi]));
  return lead + out.join("");
}
function kicker(a){
  return '<p class="kicker"><b>' + esc(RUBRIK_LANG[a.rubrik] || a.rubrik) + '</b>' + (a.liga ? '<span class="pipe" aria-hidden="true"></span>' + esc(a.liga) : "") + "</p>";
}
function slug(s){
  return String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48) || "bericht";
}

/* ---------- Shell ---------- */
function header(route){
  const cur = route.name === "rubrik" ? route.arg : (route.name === "home" ? "alle" : "");
  const links = ['<a href="#/" ' + (cur==="alle"?'aria-current="page"':"") + '>Übersicht</a>']
    .concat(RUBRIKEN.map(r => '<a href="#/rubrik/' + r + '" ' + (cur===r?'aria-current="page"':"") + '>' + esc(r) + '</a>'))
    .concat(['<a href="#/kader" ' + (route.name==="kader"?'aria-current="page"':"") + '>Kader</a>'])
    .concat(['<a href="#/archiv" ' + (route.name==="archive"?'aria-current="page"':"") + '>Archiv</a>'])
    .concat(['<a href="#/partner" ' + (route.name==="partner"?'aria-current="page"':"") + '>Partner</a>']);
  return '<header class="top"><div class="wrap">' +
    '<a class="brand" href="#/"><img src="' + state.crest + '" alt="FC Tirschenreuth"><span><b>Sportpark Journal</b><i>online</i></span></a>' +
    '<button class="burger" type="button" data-burger aria-expanded="false" aria-controls="mainnav" aria-label="Menü öffnen"><span></span><span></span><span></span></button>' +
    '<nav class="nav" id="mainnav" aria-label="Rubriken">' + links.join("") + '</nav>' +
    /* Redaktion-Button ausgeblendet, Login-Bereich folgt spaeter */
    '</div></header>';
}
function footer(){
  const f = state.footer;
  return '<footer class="foot"><div class="wrap">' +
    '<img src="' + state.crest + '" alt="">' +
    '<div><h4>Sportpark Journal online</h4><p>' + esc(f.claim) + '</p><p>Instagram: <a href="https://www.instagram.com/fctirschenreuth/" rel="noopener" target="_blank">@fctirschenreuth</a></p></div>' +
    '<div><h4>Impressum</h4>' + f.impressum.split("\n").map(l => "<p>" + esc(l) + "</p>").join("") + '<p class="foot-links"><a href="#/partner">Unsere Werbepartner</a> <span aria-hidden="true">·</span> <a href="#/datenschutz">Datenschutz</a></p></div>' +
    '</div></footer>';
}
function gameDate(d){
  const m = String(d || "").match(/(\d{1,2})\.(\d{1,2})\./); if(!m) return null;
  const y0 = parseInt(String(state.season).slice(0,4),10) || new Date().getFullYear();
  const mo = +m[2], y = mo >= 7 ? y0 : y0 + 1;
  return new Date(y, mo - 1, +m[1], 23, 59);
}
function ticker(){
  const now = new Date(), items = [];
  state.fixtures.filter(f => /^(erste|reserve)/i.test(f.team)).forEach(f => (f.games || []).forEach(g => {
    const d = gameDate(g.date); if(!d || d < now) return;
    const pair = g.ha === "H" ? "FC Tirschenreuth gegen " + g.opp : g.opp + " gegen FC Tirschenreuth";
    items.push({d, html:'<li><b>' + esc(g.date) + (g.time ? " " + esc(g.time) : "") + '</b> ' + esc(f.team) + ': ' + esc(pair) + (g.ha === "H" ? " im Sportpark" : "") + '</li>'});
  }));
  if(!items.length) return "";
  items.sort((a,b) => a.d - b.d);
  const ul = '<ul>' + items.map(i => i.html).join("") + '</ul>';
  return '<div class="ticker" role="region" aria-label="Nächste Spiele der Herren"><div class="ticker-track">' + ul + ul.replace("<ul>",'<ul aria-hidden="true">') + '</div></div>';
}

/* ---------- Home ---------- */
function cardHTML(a, big, withIssue){
  const k = coverKey(a);
  return '<article class="card' + (big ? " big" : "") + '"><a class="hit" href="#/bericht/' + a.id + '">' +
    (k ? '<div class="ph"><img' + (isChair(a) || (!a.img && a.thumb) ? ' class="portrait"' : "") + ' src="' + img(k) + '"' + (isChair(a) || (!a.img && a.thumb) ? "" : fp(k)) + ' alt="' + esc(isChair(a) ? "Stefan Wonke" : (a.caption || a.title)) + '" loading="lazy"></div>' : "") +
    (withIssue === false ? "" : issueTag(a)) + kicker(a) + '<h3>' + esc(a.title) + '</h3></a><p class="teaser">' + esc(a.teaser) + '</p></article>';
}
function fixturesHTML(){
  const g = state.fixtures[fxTab] || state.fixtures[0];
  if(!g) return "";
  const tabs = state.fixtures.map((f,i) => '<button class="tab" type="button" role="tab" aria-selected="' + (i===fxTab) + '" data-fx="' + i + '">' + esc(f.team) + '</button>').join("");
  const rows = g.games.map(x => '<li><span class="d">' + esc(x.date) + '</span><span class="o">' + esc(x.opp) + '</span><span class="w' + (x.ha==="H"?" home":"") + '">' + (x.ha==="H" ? "Heimspiel" : "Auswärts") + '</span></li>').join("");
  return '<div class="tabs" role="tablist" aria-label="Mannschaft">' + tabs + '</div>' +

function compress(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error("read"));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error("decode"));
      im.onload = () => {
        const max = 1400, sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
