  if(s.partners) (s.partners.list || []).forEach(p => used.add(p.img));
  s.articles.forEach(a => { used.add(a.img); used.add(a.thumb); (a.gallery || []).forEach(g => used.add(g.img)); });
  Object.keys(s.images).forEach(k => { if(!used.has(k)) delete s.images[k]; });
  return s;
}
function buildHTML(s){
  return "<!doctype html>\n<html lang=\"de\">\n<head>\n" + HEAD + "\n<style id=\"css\">" + document.getElementById("css").textContent + "</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script id=\"state\" type=\"application/json\">" +
    JSON.stringify(s).replace(/</g, "\\u003c") + "<\/script>\n<script id=\"app\">" + document.getElementById("app").textContent + "<\/script>\n</body>\n</html>\n";
}
async function publish(){
  if(!artifactNS || busy) return;
  const html = buildHTML(pruned());
  if(html.length > MAX_BYTES){ toast("Die Seite ist zu groß. Entferne ein paar ältere Bilder und versuche es noch einmal."); return; }
  busy = true; render();
  try{
    sessionStorage.setItem("spj-return", location.hash || "#/");
    await artifactNS.publish(html);
    dirty = false;
    toast("Veröffentlicht. Die Seite lädt neu.");
  }catch(e){
    busy = false;
    const code = e && e.code;
    if(code === "conflict") toast("Jemand hat die Seite gerade geändert. Sie lädt jetzt neu, deine letzten Änderungen sind nicht gespeichert.");
    else if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled"){ canEdit = false; artifactNS = null; toast("In dieser Ansicht kannst du nur lesen. Öffne die Seite in Claude mit Bearbeitungsrechten."); }
    else if(code === "too_large") toast("Die Seite ist zu groß. Entferne ein paar ältere Bilder.");
    else if(code === "rate_limited") toast("Zu viele Veröffentlichungen in kurzer Zeit. Warte eine Minute.");
    else toast("Veröffentlichen hat nicht geklappt. Versuch es gleich noch einmal.");
    render();
  }
}
function toast(msg){
  let t = document.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(t._h); t._h = setTimeout(() => t.remove(), 5200);
}

/* ---------- Router ---------- */
function parse(){
  const p = (location.hash || "#/").replace(/^#\/?/, "").split("/");
  if(p[0] === "bericht") return {name:"article", arg:decodeURIComponent(p[1] || "")};
  if(p[0] === "rubrik") return {name:"rubrik", arg:decodeURIComponent(p[1] || "")};
  if(p[0] === "redaktion") return {name:"desk"};
  if(p[0] === "archiv") return {name:"archive"};
  if(p[0] === "kader") return {name:"kader"};
  if(p[0] === "datenschutz") return {name:"privacy"};
  if(p[0] === "partner") return {name:"partner"};
  return {name:"home"};
}
let lastRoute = "", introShown = false;
function render(){
  const r = parse();
  let v = r.name === "article" ? viewArticle(r.arg) : r.name === "rubrik" ? viewHome(r.arg) : r.name === "desk" ? viewDesk() : r.name === "archive" ? viewArchive() : r.name === "kader" ? viewKader() : r.name === "privacy" ? viewPrivacy() : r.name === "partner" ? viewPartner() : viewHome(null);
  const y = window.scrollY, key = location.hash;
  root.innerHTML = header(r) + "<main>" + v + "</main>" + footer();
  if(key !== lastRoute){ if(!(location.hash === "#aufmacher")) window.scrollTo(0,0); lastRoute = key; } else window.scrollTo(0,y);
  const hero = document.getElementById("hero");
  if(hero && !introShown){ hero.classList.add("intro"); introShown = true; }
  onScroll();
}
function onScroll(){
  const hero = document.getElementById("hero");
  if(!hero || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = Math.min(1, Math.max(0, window.scrollY / hero.offsetHeight));
  hero.style.setProperty("--p", p.toFixed(3));
}
let ticking = false;
window.addEventListener("scroll", () => { if(!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; onScroll(); }); } }, {passive:true});
const navStack = [location.hash || "#/"];
window.addEventListener("hashchange", () => { const k = location.hash || "#/"; if(k === "#aufmacher") return; if(navStack.length > 1 && navStack[navStack.length - 2] === k) navStack.pop(); else if(navStack[navStack.length - 1] !== k) navStack.push(k); });
window.addEventListener("hashchange", () => {
  if(location.hash === "#aufmacher"){ const el = document.getElementById("aufmacher"); if(el){ el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); } history.replaceState(null,"","#/"); lastRoute = "#/"; return; }
  render();
});
window.addEventListener("beforeunload", e => { if(dirty && !busy){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- Events ---------- */
root.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if(!t) return;
  if(t.dataset.spot != null){ const i = +t.dataset.spot; if(spotOpen === i && !spotHover) hideSpot(); else showSpot(i, t); spotHover = false; return; }
  if(t.dataset.back != null){ e.preventDefault(); if(navStack.length > 1) history.back(); else location.hash = "#/"; return; }
  if(t.dataset.burger != null){ const top = t.closest(".top"), open = !top.classList.contains("open"); top.classList.toggle("open", open); t.setAttribute("aria-expanded", open); t.setAttribute("aria-label", open ? "Menü schließen" : "Menü öffnen"); return; }
  if(t.dataset.go){ location.hash = t.dataset.go; return; }
  if(t.dataset.fx){ fxTab = +t.dataset.fx; document.getElementById("fxbox").innerHTML = fixturesHTML(); const b = document.querySelector('[data-fx="' + fxTab + '"]'); if(b) b.focus(); return; }
  if(t.dataset.dtab){ deskTab = t.dataset.dtab; editingId = null; render(); return; }
  if(t.id === "pub"){ publish(); return; }
  if(t.dataset.edit){ editingId = t.dataset.edit; render(); return; }
  if(t.id === "backlist"){ editingId = null; render(); return; }
  if(t.id === "viewart"){ location.hash = "#/bericht/" + editingId; return; }
  if(t.dataset.up){ const i = state.articles.findIndex(a => a.id === t.dataset.up); if(i > 0){ const [a] = state.articles.splice(i,1); state.articles.splice(i-1,0,a); markDirty(); render(); } return; }
  if(t.dataset.del){ const a = byId(t.dataset.del); if(a && confirm("„" + a.title + "“ wirklich löschen?")){ state.articles = state.articles.filter(x => x !== a); markDirty(); render(); } return; }
  if(t.id === "newart"){
    let id = "bericht-" + Date.now().toString(36);
    state.articles.unshift({id, issue:state.currentIssue, rubrik:"Erste", liga:"", title:"Neuer Bericht", teaser:"", date:new Date().toISOString().slice(0,10), author:"", lead:false, img:"", caption:"", body:"", gallery:[]});
    editingId = id; markDirty(); render(); return;
  }
  if(t.dataset.gdel != null){ const a = byId(editingId); a.gallery.splice(+t.dataset.gdel,1); markDirty(); render(); return; }
  if(t.dataset.arch){ archFilter = t.dataset.arch; render(); return; }
  if(t.dataset.setcur){ state.currentIssue = t.dataset.setcur; markDirty(); render(); return; }
  if(t.dataset.issdel){ state.issues = state.issues.filter(i => i.id !== t.dataset.issdel); markDirty(); render(); return; }
  if(t.id === "issadd"){ const id = "ausgabe-" + Date.now().toString(36); state.issues.push({id, label:"Neue Ausgabe", type:"Ausgabe", date:new Date().toISOString().slice(0,10)}); markDirty(); render(); return; }
  if(t.id === "fxadd"){ state.fixtures.push({team:"Neue Mannschaft", league:"", games:[]}); markDirty(); render(); return; }
  if(t.dataset.fxdel != null){ if(confirm("Diese Mannschaft aus den Spielplänen entfernen?")){ state.fixtures.splice(+t.dataset.fxdel,1); fxTab = 0; markDirty(); render(); } return; }
});
root.addEventListener("input", e => {
  const el = e.target, form = el.closest("[data-art]");
  if(form && el.dataset.f){
    const a = byId(form.dataset.art);
    if(el.dataset.f === "lead"){ state.articles.forEach(x => { if(x.issue === a.issue) x.lead = false; }); a.lead = el.checked; }
    else a[el.dataset.f] = el.value;
    markDirty(); return;
  }
  if(form && el.dataset.gcap != null){ byId(form.dataset.art).gallery[+el.dataset.gcap].caption = el.value; markDirty(); return; }
  if(el.dataset.issf){ issueById(el.dataset.iss)[el.dataset.issf] = el.value; markDirty(); return; }
  if(el.dataset.fxf){ state.fixtures[+el.dataset.fxi][el.dataset.fxf] = el.value; markDirty(); return; }
  if(el.dataset.fxg != null){
    state.fixtures[+el.dataset.fxg].games = el.value.split("\n").map(l => l.split("|").map(s => s.trim())).filter(p => p[0] && p[1]).map(p => ({date:p[0], opp:p[1], ha:/^h/i.test(p[2] || "") ? "H" : "A"}));
    markDirty(); return;
  }
  if(el.dataset.p){
    const k = el.dataset.p;
    if(k === "bandTitle") state.band.title = el.value;
    else if(k === "bandText") state.band.text = el.value;
    else state[k] = el.value;
    markDirty();
  }
});
root.addEventListener("change", async e => {
  const el = e.target;
  if((el.type === "checkbox" && el.dataset.f === "lead") || el.dataset.f === "issue" || el.dataset.issf === "type"){ render(); return; }
  if(!el.dataset.imgfield || !el.files || !el.files[0]) return;
  try{
    const data = await compress(el.files[0]), k = newKey();
    state.images[k] = data;
    const f = el.dataset.imgfield;
    if(f === "hero") state.heroImg = k;
    else if(f === "band") state.bandImg = k;
    else {
      const a = byId(editingId);
      if(f === "img") a.img = k; else (a.gallery = a.gallery || []).push({img:k, caption:""});
    }
    markDirty(); render();
  }catch(err){ toast("Dieses Bild konnte nicht gelesen werden. Versuch es mit einem JPG oder PNG."); }
});

/* ---------- Boot ---------- */
const ret = sessionStorage.getItem("spj-return");
if(ret){ sessionStorage.removeItem("spj-return"); if(!location.hash || location.hash === "#/") history.replaceState(null,"",ret); }
render();
(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    const [art, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    if(!art) return;
    const ok = user ? await user.canEdit() : false;
    artifactNS = art;
    if(ok){ canEdit = true; render(); }
    else if(parse().name === "desk") render();
  }catch(e){}
})();
root.addEventListener("pointerover", e => { const b = e.target.closest && e.target.closest(".cal-spot"); if(b && e.pointerType === "mouse"){ showSpot(+b.dataset.spot, b); spotHover = true; } });
root.addEventListener("pointerout", e => { const b = e.target.closest && e.target.closest(".cal-spot"); if(b && e.pointerType === "mouse" && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".cal-spot"))) hideSpot(); });
document.addEventListener("pointerdown", e => { if(spotOpen > -1 && !(e.target.closest && e.target.closest(".cal-spot"))) hideSpot(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") hideSpot(); });
root.addEventListener("focusin", e => { const b = e.target.closest && e.target.closest(".cal-spot"); if(b && b.matches(":focus-visible")) showSpot(+b.dataset.spot, b); });
root.addEventListener("input", e => {
  if(!e.target.matches || !e.target.matches("[data-ksearch]")) return;
  const q = e.target.value.trim().toLowerCase(); let n = 0;
  document.querySelectorAll(".kgrid.players .kp").forEach(f => { const on = !q || f.dataset.name.includes(q); f.hidden = !on; if(on) n++; });
  const none = document.querySelector(".k-none"); if(none) none.hidden = n > 0;
});
})();
</script>
